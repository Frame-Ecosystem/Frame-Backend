# ============================================
# CLIENT ENDPOINTS
# ============================================

  /v1/client/lounges:
    get:
      tags:
        - client
      summary: Get all lounges with pagination (for clients to browse)
      description: |
        Browse all available lounges with filtering, searching, and pagination.
        Only non-blocked lounges are returned.
        Sensitive fields (password, tokens) are automatically excluded.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
          description: Page number (minimum 1)
        - name: limit
          in: query
          type: integer
          default: 10
          description: Items per page (minimum 1, maximum 100)
        - name: search
          in: query
          type: string
          description: Search term (searches in loungeTitle, firstName, lastName, bio)
          example: "Hair Salon"
        - name: gender
          in: query
          type: string
          enum: [male, female, unisex, kids]
          description: Filter by gender category
        - name: sortBy
          in: query
          type: string
          enum: [createdAt, loungeTitle, firstName, lastName]
          default: createdAt
          description: Field to sort by
        - name: sortOrder
          in: query
          type: string
          enum: [asc, desc]
          default: desc
          description: Sort order (ascending or descending)
      responses:
        200:
          description: Lounges retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/LoungePublicProfile'
              pagination:
                type: object
                properties:
                  currentPage:
                    type: integer
                    example: 1
                  totalPages:
                    type: integer
                    example: 5
                  totalItems:
                    type: integer
                    example: 47
                  itemsPerPage:
                    type: integer
                    example: 10
                  hasNextPage:
                    type: boolean
                    example: true
                  hasPrevPage:
                    type: boolean
                    example: false
              message:
                type: string
                example: Lounges retrieved successfully
        400:
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated or not a client
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

  /v1/client/lounges/{loungeId}:
    get:
      tags:
        - client
      summary: Get lounge details by ID (for clients to view lounge profile)
      description: |
        Retrieve detailed information about a specific lounge.
        Only non-blocked lounges can be accessed.
        Sensitive fields are automatically excluded.
      security:
        - bearerAuth: []
      parameters:
        - name: loungeId
          in: path
          required: true
          type: string
          description: Lounge ID
          example: "507f1f77bcf86cd799439011"
      responses:
        200:
          description: Lounge details retrieved successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/LoungePublicProfile'
              message:
                type: string
                example: Lounge details retrieved successfully
