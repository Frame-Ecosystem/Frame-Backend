# =====================================================================
#  DEFINITIONS
# =====================================================================
definitions:

  # ------------------------------------------------------------------
  #  Common
  # ------------------------------------------------------------------
  ErrorResponse:
    type: object
    properties:
      message:
        type: string
        description: Human-readable error message
        example: "Invalid credentials"
      code:
        type: string
        description: Machine-readable error code for client handling
        example: "INVALID_CREDENTIALS"

  Pagination:
    type: object
    properties:
      page:
        type: integer
        example: 1
      limit:
        type: integer
        example: 10
      total:
        type: integer
        example: 42
      pages:
        type: integer
        example: 5

  # ------------------------------------------------------------------
  #  Auth DTOs
  # ------------------------------------------------------------------
  LoginUserDto:
    type: object
    required:
      - emailOrPhone
      - password
    properties:
      emailOrPhone:
        type: string
        description: Email address or 8-digit phone number
        example: "user@example.com"
      password:
        type: string
        description: User password
        example: "SecureP@ss123"

  ForgotPasswordDto:
    type: object
    required:
      - email
    properties:
      email:
        type: string
        format: email
        example: "user@example.com"

  ResetPasswordDto:
    type: object
    required:
      - token
      - newPassword
    properties:
      token:
        type: string
        description: Reset token from email link
      newPassword:
        type: string
        minLength: 8
        maxLength: 128
        description: "New password  -  min 8 chars, uppercase, lowercase, number, special char (@$!%*?&)"
        example: "NewSecureP@ss456"

  VerifyEmailCodeDto:
    type: object
    required:
      - code
    properties:
      code:
        type: string
        description: Verification code received via email

  # ------------------------------------------------------------------
  #  User DTOs
  # ------------------------------------------------------------------
  CreateUserDto:
    type: object
    required:
      - password
    properties:
      email:
        type: string
        format: email
        description: User email (normalized to lowercase)
        example: "user@example.com"
      password:
        type: string
        minLength: 8
        maxLength: 128
        description: "8-128 chars with uppercase, lowercase, number, special char (@$!%*?&)"
        example: "SecureP@ss123"
      phoneNumber:
        type: string
        pattern: '^\d{8}$'
        description: Exactly 8 digits
        example: "12345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
        maxLength: 50
        example: "John"
      lastName:
        type: string
        maxLength: 50
        example: "Doe"
      loungeTitle:
        type: string
        maxLength: 100
        example: "Elite Hair Salon"
      type:
        type: string
        enum: [user, client, lounge]
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri

  AdminCreateUserDto:
    allOf:
      - $ref: '#/definitions/CreateUserDto'
      - type: object
        properties:
          type:
            type: string
            enum: [user, client, lounge, admin]
            description: User type (admin can set any type)
          isBlocked:
            type: boolean
            default: false

  UpdateUserDto:
    type: object
    description: All fields optional. Password cannot be changed here.
    properties:
      email:
        type: string
        format: email
      phoneNumber:
        type: string
        pattern: '^\d{8}$'
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
        maxLength: 50
      lastName:
        type: string
        maxLength: 50
      bio:
        type: string
        maxLength: 500
      theme:
        type: string
        maxLength: 50
      loungeTitle:
        type: string
        maxLength: 100
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri
      coverImage:
        type: string
        format: uri

  ChangePasswordDto:
    type: object
    required:
      - currentPassword
      - newPassword
      - newPasswordConfirm
    properties:
      currentPassword:
        type: string
        example: "OldP@ssword123"
      newPassword:
        type: string
        minLength: 8
        maxLength: 128
        description: "Same strength requirements as signup"
        example: "NewSecureP@ss456"
      newPasswordConfirm:
        type: string
        description: Must match newPassword
        example: "NewSecureP@ss456"

  DeleteAccountDto:
    type: object
    required:
      - password
    properties:
      password:
        type: string
        description: Current password for confirmation
        example: "MyCurrentP@ss123"

  UpdateClientProfileDto:
    type: object
    properties:
      firstName:
        type: string
        maxLength: 50
      lastName:
        type: string
        maxLength: 50

  UpdateThemeDto:
    type: object
    required:
      - theme
    properties:
      theme:
        type: string
        maxLength: 50
        example: "dark"

  UpdateLanguageDto:
    type: object
    required:
      - language
    properties:
      language:
        type: string
        maxLength: 10
        example: "en"
        description: Language code (e.g. 'en', 'ar', 'fr')

  UpdateLoungeProfileDto:
    type: object
    properties:
      loungeTitle:
        type: string
        maxLength: 100
        example: "Elite Hair Salon"
      openingHours:
        $ref: '#/definitions/DayOpeningHoursDto'

  LocationDto:
    type: object
    required:
      - latitude
      - longitude
      - address
      - placeId
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
        example: 36.8065
      longitude:
        type: number
        minimum: -180
        maximum: 180
        example: 10.1815
      address:
        type: string
        maxLength: 500
        example: "123 Main Street, Tunis, Tunisia"
      placeId:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        example: "ChIJN1t_tDeuEmsRUsoyG83frY4"
      placeName:
        type: string
        maxLength: 200
        example: "Elite Hair Salon  -  Downtown"

  OpeningHoursDto:
    type: object
    properties:
      from:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        example: "09:00"
      to:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        example: "18:00"

  DayOpeningHoursDto:
    type: object
    description: "Opening hours per day. Omit a day to leave unchanged; set `from`/`to` to null for closed days."
    properties:
      monday:
        $ref: '#/definitions/OpeningHoursDto'
      tuesday:
        $ref: '#/definitions/OpeningHoursDto'
      wednesday:
        $ref: '#/definitions/OpeningHoursDto'
      thursday:
        $ref: '#/definitions/OpeningHoursDto'
      friday:
        $ref: '#/definitions/OpeningHoursDto'
      saturday:
        $ref: '#/definitions/OpeningHoursDto'
      sunday:
        $ref: '#/definitions/OpeningHoursDto'

  WeekOpeningHours:
    type: object
    description: Full week opening hours (null values indicate closed)
    properties:
      monday:
        $ref: '#/definitions/OpeningHoursDto'
      tuesday:
        $ref: '#/definitions/OpeningHoursDto'
      wednesday:
        $ref: '#/definitions/OpeningHoursDto'
      thursday:
        $ref: '#/definitions/OpeningHoursDto'
      friday:
        $ref: '#/definitions/OpeningHoursDto'
      saturday:
        $ref: '#/definitions/OpeningHoursDto'
      sunday:
        $ref: '#/definitions/OpeningHoursDto'

  # ------------------------------------------------------------------
  #  User Responses
  # ------------------------------------------------------------------
  UserResponse:
    type: object
    description: User object (sensitive fields excluded  -  no password, no refreshTokens)
    properties:
      _id:
        type: string
        example: "507f1f77bcf86cd799439011"
      email:
        type: string
        example: "user@example.com"
      type:
        type: string
        enum: [user, client, lounge, admin]
      phoneNumber:
        type: string
        example: "12345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
        example: "John"
      lastName:
        type: string
        example: "Doe"
      bio:
        type: string
      loungeTitle:
        type: string
      theme:
        type: string
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: object
        properties:
          url:
            type: string
          publicId:
            type: string
      coverImage:
        type: object
        properties:
          url:
            type: string
          publicId:
            type: string
      openingHours:
        $ref: '#/definitions/WeekOpeningHours'
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                ipAddress:
                  type: string
      isBlocked:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  LoungePublicProfile:
    type: object
    description: Lounge public profile for client browsing
    properties:
      _id:
        type: string
      email:
        type: string
      type:
        type: string
        example: "lounge"
      phoneNumber:
        type: string
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
      lastName:
        type: string
      bio:
        type: string
      loungeTitle:
        type: string
        example: "Elite Hair Salon"
      openingHours:
        $ref: '#/definitions/WeekOpeningHours'
