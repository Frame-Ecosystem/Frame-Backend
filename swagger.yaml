    patch:
      tags:
        - service-suggestions
      summary: Update service suggestion status (Admin only)
      description: Update the status of a service suggestion. Only admins can update status.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
