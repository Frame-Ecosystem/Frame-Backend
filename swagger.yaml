# ============================================
# SERVICE SUGGESTIONS ENDPOINTS
# ============================================

  /v1/service-suggestions:
    get:
      tags:
        - service-suggestions
      summary: Get all service suggestions (Admin only)
      description: Retrieve all service suggestions with optional filtering and pagination. Admin access required.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          type: integer
          minimum: 1
          default: 1
          description: Page number for pagination
        - name: limit
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Number of items per page
        - name: status
          in: query
          type: string
          enum: [pending, rejected, implemented]
          description: Filter by suggestion status
        - name: loungeId
          in: query
          type: string
          description: Filter by lounge ID
      responses:
        200:
          description: Service suggestions retrieved successfully
          schema:
            type: object
            properties:
              suggestions:
                type: array
                items:
                  $ref: '#/definitions/ServiceSuggestionResponse'
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    example: 25
                  pages:
                    type: integer
                    example: 3
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Server error
    post:
      tags:
        - service-suggestions
      summary: Create a service suggestion (Lounge only)
      description: Create a new service suggestion. Only lounge owners can create suggestions.
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateServiceSuggestionDto'
      responses:
        201:
          description: Service suggestion created successfully
          schema:
            $ref: '#/definitions/ServiceSuggestionResponse'
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - Lounge access required
        500:
          description: Server error

  /v1/service-suggestions/my:
    get:
      tags:
        - service-suggestions
      summary: Get my service suggestions (Lounge only)
      description: Retrieve service suggestions created by the authenticated lounge user.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          type: integer
          minimum: 1
          default: 1
          description: Page number for pagination
        - name: limit
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Number of items per page
        - name: status
          in: query
          type: string
          enum: [pending, rejected, implemented]
          description: Filter by suggestion status
      responses:
        200:
          description: Service suggestions retrieved successfully
          schema:
            type: object
            properties:
              suggestions:
                type: array
                items:
                  $ref: '#/definitions/ServiceSuggestionResponse'
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    example: 5
                  pages:
                    type: integer
                    example: 1
        401:
          description: Unauthorized
        403:
          description: Forbidden - Lounge access required
        500:
          description: Server error

  /v1/service-suggestions/{id}/status:
    patch:
      tags:
        - service-suggestions
      summary: Update service suggestion status (Admin only)
      description: Update the status of a service suggestion. Only admins can update status.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Service suggestion ID
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateServiceSuggestionStatusDto'
      responses:
        200:
          description: Service suggestion status updated successfully. When status is approved with customization options, service and lounge service are created.
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  suggestion:
                    $ref: '#/definitions/ServiceSuggestionResponse'
                  service:
                    $ref: '#/definitions/ServiceResponse'
                  loungeService:
                    $ref: '#/definitions/LoungeServiceResponse'
                required:
                  - suggestion
              message:
                type: string
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        404:
          description: Service suggestion not found
        500:
          description: Server error

  /v1/service-suggestions/{id}/admin-approve:
    patch:
      tags:
        - service-suggestions
      summary: Admin approve service suggestion and create service/lounge service
      description: Approve a service suggestion and automatically create a service and lounge service. Admins can optionally provide a custom service name, otherwise the suggestion name will be used. Only admins can perform this action.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Service suggestion ID
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AdminApproveServiceSuggestionDto'
      responses:
        200:
          description: Service suggestion approved and implemented successfully
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  suggestion:
                    $ref: '#/definitions/ServiceSuggestionResponse'
                  service:
                    $ref: '#/definitions/ServiceResponse'
                  loungeService:
                    $ref: '#/definitions/LoungeServiceResponse'
              message:
                type: string
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        404:
          description: Service suggestion not found
        409:
          description: Service already exists
        500:
          description: Server error

  /v1/service-suggestions/{id}:
    delete:
      tags:
        - service-suggestions
      summary: Delete a service suggestion
      description: Delete a service suggestion. Lounges can delete their own suggestions, admins can delete any suggestion.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Service suggestion ID
      responses:
        200:
          description: Service suggestion deleted successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden - Not authorized to delete this suggestion
        404:
          description: Service suggestion not found
        500:
          description: Server error

# ============================================
# DEFINITIONS
# ============================================

definitions:
  CreateUserDto:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
        description: User email address (will be normalized to lowercase)
        example: user@example.com
      password:
        type: string
        minLength: 8
        maxLength: 128
        description: |
          Password must contain at least 8 characters with uppercase, lowercase, number, and special character (@$!%*?&)
        example: SecureP@ss123
      phoneNumber:
        type: string
        description: Phone number in international format (optional)
        example: "+21612345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
        default: unisex
        description: User gender (optional)
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri
        description: URL to profile image (optional)

  AdminCreateUserDto:
    allOf:
      - $ref: '#/definitions/CreateUserDto'
      - type: object
        properties:
          type:
            type: string
            enum: [user, client, lounge, admin]
            default: user
            description: User type

  UpdateUserDto:
    type: object
    description: All fields are optional. Password and user type cannot be changed.
    properties:
      email:
        type: string
        format: email
        example: newemail@example.com
      phoneNumber:
        type: string
        example: "+21698765432"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri

      LoginUserDto:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            description: Email address
            example: user@example.com
          password:
            type: string
            description: User password
            example: SecureP@ss123

  ChangePasswordDto:
    type: object
    required:
      - currentPassword
      - newPassword
      - newPasswordConfirm
    properties:
      currentPassword:
        type: string
        description: Current password
        example: OldP@ssword123
      newPassword:
        type: string
        minLength: 8
        maxLength: 128
        description: New password (same requirements as signup)
        example: NewSecureP@ss456
      newPasswordConfirm:
        type: string
        description: Confirm new password (must match newPassword)
        example: NewSecureP@ss456

  DeleteAccountDto:
    type: object
    required:
      - password
    properties:
      password:
        type: string
        description: Current password for verification before account deletion
        example: MyCurrentP@ss123

  LocationDto:
    type: object
    required:
      - latitude
      - longitude
      - address
      - placeId
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
        description: Latitude coordinate
        example: 36.8065
      longitude:
        type: number
        minimum: -180
        maximum: 180
        description: Longitude coordinate
        example: 10.1815
      address:
        type: string
        maxLength: 500
        description: Full address
        example: 123 Main Street, Tunis, Tunisia
      placeId:
        type: string
        description: Google Places ID or custom place identifier
        example: ChIJN1t_tDeuEmsRUsoyG83frY4
      placeName:
        type: string
        maxLength: 200
        description: Human-readable place name (optional)
        example: "Elite Hair Salon - Downtown Branch"

  OpeningHours:
    type: object
    description: Opening hours for a specific day
    properties:
      from:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        description: Opening time in HH:MM format (24-hour)
        example: "09:00"
      to:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        description: Closing time in HH:MM format (24-hour)
        example: "18:00"

  UserResponse:
    type: object
    description: User object with sensitive fields removed (no password, no refreshTokens)
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      email:
        type: string
        example: user@example.com
      phoneNumber:
        type: string
        example: "+21612345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      # Note: User type is determined by 'type' field
      # Admin users have type: 'admin', Client users have type: 'client', Lounge users have type: 'lounge'
      # Regular users have type: 'user'
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        example: https://res.cloudinary.com/xxx/image/upload/v123/profile_abc.jpg
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  LoungePublicProfile:
    type: object
    description: Lounge public profile (sensitive fields excluded) for client browsing
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      email:
        type: string
        example: lounge@example.com
      type:
        type: string
        example: lounge
      phoneNumber:
        type: string
        example: "+21612345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
        description: Gender category the lounge serves
      firstName:
        type: string
        example: "John"
      lastName:
        type: string
        example: "Doe"
      bio:
        type: string
        example: "Professional hair salon with 10 years experience"
      loungeTitle:
        type: string
        example: "Elite Hair Salon"
      openingHours:
        type: object
        properties:
          monday:
            $ref: '#/definitions/OpeningHours'
          tuesday:
            $ref: '#/definitions/OpeningHours'
          wednesday:
            $ref: '#/definitions/OpeningHours'
          thursday:
            $ref: '#/definitions/OpeningHours'
          friday:
            $ref: '#/definitions/OpeningHours'
          saturday:
            $ref: '#/definitions/OpeningHours'
          sunday:
            $ref: '#/definitions/OpeningHours'
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: object
        properties:
          url:
            type: string
            example: https://res.cloudinary.com/xxx/image/upload/v123/profile_abc.jpg
          publicId:
            type: string
            example: profile_abc
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                ipAddress:
                  type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  OnlineUserInfo:
    type: object
    properties:
      _id:
        type: string
      email:
        type: string
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: string

  ErrorResponse:
    type: object
    properties:
      message:
        type: string
        description: User-friendly error message
        example: Email already registered
      code:
        type: string
        description: Error code for client-side handling
        example: EMAIL_EXISTS
  LoungeServiceResponse:
    type: object
    description: Lounge service object
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      loungeId:
        type: string
        description: Reference to User (lounge type)
        example: 507f1f77bcf86cd799439010
      serviceId:
        type: string
        description: Reference to Service
        example: 507f1f77bcf86cd799439012
      price:
        type: number
        description: Price in smallest currency unit (e.g., cents for USD)
        example: 2500
      duration:
        type: integer
        description: Duration in minutes
        example: 30
      gender:
        type: string
        enum: [men, women, unisex, kids]
        description: Gender category for the service
        example: men
      status:
        type: string
        enum: [ACTIVE, INACTIVE]
        description: Service status
        example: ACTIVE
      description:
        type: string
        description: Service description
        example: "Premium haircut service"
      isActive:
        type: boolean
        description: Service active status
        example: true
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  ServiceResponse:
    type: object
    description: Service object
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      name:
        type: string
        description: Service name
        example: "Premium Haircut"
      categoryId:
        type: string
        description: Reference to ServiceCategory
        example: 507f1f77bcf86cd799439012
      description:
        type: string
        description: Service description
