swagger: "2.0"
info:
  title: Barber App API
  version: 1.0.0
host: localhost:3000
basePath: /
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
  csrfToken:
    type: apiKey
    name: X-CSRF-Token
    in: header
tags:
  - name: auth
  - name: admin
  - name: admin services
  - name: current users
  - name: lounge services
  - name: services
  - name: service categories
paths:
 # ============================================
  # AUTH ENDPOINTS
  # ============================================

  /v1/auth/signup:
    post:
      tags:
        - auth
      summary: Register a new user
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
                description: User email address (will be normalized to lowercase)
                example: newuser@example.com
              password:
                type: string
                minLength: 8
                maxLength: 128
                description: Password must contain at least 8 characters with uppercase, lowercase, number, and special character (@$!%*?&)
                example: SecurePass123!
              phoneNumber:
                type: string
                description: Phone number in international format (optional)
                example: "+21650922140"
              gender:
                type: string
                enum: [male, female, unisex, kids]
                default: unisex
                description: User gender (optional)
                example: male
              type:
                type: string
                enum: [user, client, lounge]
                description: User type - determines inheritance (client, lounge, or regular user)
                example: user
              location:
                $ref: '#/definitions/LocationDto'
              profileImage:
                type: string
                format: uri
                description: URL to profile image (optional)
                example: "https://res.cloudinary.com/xxx/image/upload/v123/profile_abc.jpg"
      responses:
        201:
          description: User created successfully
        400:
          description: Validation error
        409:
          description: Email or phone already registered
        429:
          description: Rate limit exceeded
        500:
          description: Server error

  /v1/auth/login:
    post:
      tags:
        - auth
      summary: Log in to an existing account
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                description: Email address
                example: user@example.com
              password:
                type: string
                description: User password
                example: SecureP@ss123
      responses:
        200:
          description: Login successful
        401:
          description: Invalid credentials
        429:
          description: Rate limit exceeded
        500:
          description: Server error

  /v1/auth/logout:
    post:
      tags:
        - auth
      summary: Log out from current device
      security:
        - bearerAuth: []
        - csrfToken: []
      responses:
        200:
          description: Logged out successfully
        401:
          description: Not authenticated
        403:
          description: CSRF token missing or invalid
        500:
          description: Server error

  /v1/auth/logout-all:
    post:
      tags:
        - auth
      summary: Log out from all devices
      security:
        - bearerAuth: []
        - csrfToken: []
      responses:
        200:
          description: Logged out from all devices
        401:
          description: Not authenticated
        403:
          description: CSRF token missing or invalid
        500:
          description: Server error

  /v1/auth/refresh-token:
    post:
      tags:
        - auth
      summary: Refresh access token
      security:
        - csrfToken: []
      responses:
        200:
          description: Token refreshed successfully
        401:
          description: Refresh token missing, expired, or invalid
        403:
          description: CSRF token missing or invalid
        429:
          description: Rate limit exceeded
        500:
          description: Server error

  /v1/auth/google/login:
    get:
      tags:
        - auth
      summary: Initiate Google OAuth login for existing users
      description: Redirects to Google for authentication. Only for existing users.
      responses:
        302:
          description: Redirect to Google OAuth
        429:
          description: Rate limit exceeded
        500:
          description: Server error

  /v1/auth/google/signup:
    get:
      tags:
        - auth
      summary: Initiate Google OAuth signup for new users
      description: Redirects to Google for authentication and account creation. Only for new users.
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [client, lounge]
          description: User type to create (client or lounge)
      responses:
        302:
          description: Redirect to Google OAuth
        400:
          description: Invalid type or user already exists
        429:
          description: Rate limit exceeded
        500:
          description: Server error

  /v1/auth/google/callback:
    get:
      tags:
        - auth
      summary: Google OAuth callback
      description: Handles the callback from Google OAuth and returns authentication tokens
      parameters:
        - name: code
          in: query
          type: string
          description: Authorization code from Google
        - name: state
          in: query
          type: string
          description: State parameter for CSRF protection
      responses:
        200:
          description: Authentication successful
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              token:
                type: string
                description: JWT access token
              expiresIn:
                type: number
                description: Token expiration time in seconds
              message:
                type: string
                example: google-auth
        401:
          description: Google authentication failed
        429:
          description: Rate limit exceeded
        500:
          description: Server error

  /v1/me/change-password:
    post:
      tags:
        - current users
      summary: Change current user password
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - currentPassword
              - newPassword
              - newPasswordConfirm
            properties:
              currentPassword:
                type: string
                description: Current password
                example: OldP@ssword123
              newPassword:
                type: string
                minLength: 8
                maxLength: 128
                description: New password (same requirements as signup)
                example: NewSecureP@ss456
              newPasswordConfirm:
                type: string
                description: Confirm new password (must match newPassword)
                example: NewSecureP@ss456
      responses:
        200:
          description: Password changed successfully
        400:
          description: Validation error or passwords don't match
        401:
          description: Current password incorrect or not authenticated
        403:
          description: CSRF token missing or invalid
        429:
          description: Rate limit exceeded
        500:
          description: Server error

 
  # ============================================
  # ADMIN ENDPOINTS
  # ============================================

  /v1/admin/users/{id}/block:
      patch:
        tags:
          - admin
        summary: Block or unblock a user
        description: |
          Set the `isBlocked` state for a user. Admins can block or unblock any user by setting `isBlocked` to true or false.
          A blocked user cannot log in or perform authenticated actions.
        security:
          - bearerAuth: []
          - csrfToken: []
        parameters:
          - name: id
            in: path
            required: true
            type: string
            description: User ID
          - name: body
            in: body
            required: true
            schema:
              type: object
              required:
                - isBlocked
              properties:
                isBlocked:
                  type: boolean
                  description: Set to true to block, false to unblock
        responses:
          200:
            description: User block state updated successfully
          400:
            description: Invalid request or missing isBlocked value
          401:
            description: Not authenticated
          403:
            description: Admin access required or CSRF token invalid
          404:
            description: User not found
          500:
            description: Server error

  /v1/admin/users:
    get:
      tags:
        - admin
      summary: Get all users (Admin only)
      description: Retrieve a list of all users. **Admin access required.**
      security:
        - bearerAuth: []
      responses:
        200:
          description: Users retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: findAll
        401:
          description: Not authenticated
        403:
          description: Admin access required
        500:
          description: Server error

    post:
      tags:
        - admin
      summary: Create a new user (Admin only)
      description: |
        Create a new user account. Admin can set user type (client, lounge, or regular user).
        **Admin access required.**
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AdminCreateUserDto'
          x-examples:
            application/json:
              email: "admincreated@example.com"
              password: "AdminP@ss123"
              phoneNumber: "+21698765432"
              type: "client"
      responses:
        201:
          description: User created successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: created
        400:
          description: Validation error
        401:
          description: Not authenticated
        403:
          description: Admin access required or CSRF token invalid
        409:
          description: Email or phone already registered
        500:
          description: Server error

  /v1/admin/users/online/status:
    get:
      tags:
        - admin
      summary: Get online users (Admin only)
      description: Retrieve a list of all currently online users with their session information. **Admin access required.**
      security:
        - bearerAuth: []
      responses:
        200:
          description: Online users retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: "507f1f77bcf86cd799439011"
                    email:
                      type: string
                      example: "user@example.com"
                    sessionTrack:
                      type: object
                      properties:
                        isOnline:
                          type: boolean
                          example: true
                        lastSeen:
                          type: string
                          format: date-time
                          example: "2025-12-07T10:30:00.000Z"
                        devices:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: "Windows PC"
                              ipAddress:
                                type: string
                                example: "192.168.1.100"
                          example:
                            - name: "Windows PC"
                              ipAddress: "192.168.1.100"
                            - name: "iPhone"
                              ipAddress: "192.168.1.101"
              message:
                type: string
                example: "Online users retrieved"
        401:
          description: Not authenticated
        403:
          description: Admin access required
        500:
          description: Server error

  /v1/admin/users/{id}:
    get:
      tags:
        - admin
      summary: Get user by ID (Admin only)
      description: Retrieve a specific user by their ID. **Admin access required.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
      responses:
        200:
          description: User found
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: findOne
        401:
          description: Not authenticated
        403:
          description: Admin access required
        404:
          description: User not found
        500:
          description: Server error

    put:
      tags:
        - admin
      summary: Update user profile (Admin only)
      description: Update any user's profile. **Admin access required.**
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateUserDto'
      responses:
        200:
          description: User updated successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: updated
        400:
          description: Validation error
        401:
          description: Not authenticated
        403:
          description: Admin access required or CSRF token invalid
        404:
          description: User not found
        409:
          description: Email or phone already taken
        500:
          description: Server error

    delete:
      tags:
        - admin
      summary: Delete user (Admin only)
      description: Delete a user by ID. **Admin access required.**
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
      responses:
        200:
          description: User deleted successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: deleted
        401:
          description: Not authenticated
        403:
          description: Admin access required or CSRF token invalid
        404:
          description: User not found
        500:
          description: Server error

  /v1/auth/session-track:
    get:
      tags:
        - admin
      summary: Get all online users (Admin only)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Online users retrieved
        401:
          description: Not authenticated
        403:
          description: Admin access required
        500:
          description: Server error
 
 
  # ============================================
  # CURRENT USER ENDPOINTS
  # ============================================
  /v1/me:
    get:
      tags:
        - current users
      summary: Get current user
      description: Retrieve the currently authenticated user's profile. No ID required; uses the authenticated token.
      security:
        - bearerAuth: []
      responses:
        200:
          description: User retrieved successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: User retrieved successfully
        401:
          description: Not authenticated
        500:
          description: Server error

    put:
      tags:
        - current users
      summary: Update current user profile
      description: |
        Update the currently authenticated user's profile information.
        **User ID is automatically extracted from the authentication token.**
        No ID parameter required.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                example: updated@example.com
              phoneNumber:
                type: string
                example: "+21655555555"
              gender:
                type: string
                enum: [male, female, unisex, kids]
              location:
                $ref: '#/definitions/LocationDto'
              profileImage:
                type: string
                format: uri
      responses:
        200:
          description: Profile updated successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: updated
        400:
          description: Validation error or invalid request data
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated
        403:
          description: CSRF token invalid
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: User not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        409:
          description: Email or phone already taken
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

    delete:
      tags:
        - current users
      summary: Delete own account
      description: |
        Permanently delete the currently authenticated user's account.
        **Requires entering your password in the request body for verification.**
        
        **Implementation**: 
        - Verifies password before proceeding
        - Prevents admin accounts from self-deletion via this endpoint
        - Delegates actual deletion to AdminService.deleteUser() to eliminate code duplication
        
        All user data will be permanently removed - this action is irreversible.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - password
            properties:
              password:
                type: string
                description: Current password for verification before account deletion
                example: SecureP@ss123
          description: |
            Must include the user's current password:
            {
              "password": "yourCurrentPassword"
            }
      responses:
        200:
          description: Account deleted successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: Account deleted successfully
        400:
          description: Invalid request, password verification failed, or admin self-deletion attempt
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated
        404:
          description: User not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error during deletion
          schema:
            $ref: '#/definitions/ErrorResponse'
        403:
          description: CSRF token invalid
          schema:
            $ref: '#/definitions/ErrorResponse'

  /v1/me/location:
    put:
      tags:
        - current users
      summary: Update current user's location
      description: |
        Update the currently authenticated user's location.
        **User ID is automatically extracted from the authentication token.**
        No ID parameter required.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - latitude
              - longitude
              - address
              - placeId
            properties:
              latitude:
                type: number
                minimum: -90
                maximum: 90
                description: Latitude coordinate
                example: 36.8065
              longitude:
                type: number
                minimum: -180
                maximum: 180
                description: Longitude coordinate
                example: 10.1815
              address:
                type: string
                maxLength: 500
                description: Full address
                example: 123 Main Street, Tunis, Tunisia
              placeId:
                type: string
                description: Google Places ID
                example: ChIJN1t_tDeuEmsRUsoyG83frY4
      responses:
        200:
          description: Location updated successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: location updated
        400:
          description: Validation error or invalid request data
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated
        403:
          description: CSRF token invalid
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: User not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

  /v1/me/image:
    put:
      tags:
        - current users
      summary: Upload current user's profile image
      description: |
        Upload or update the currently authenticated user's profile image.
        **User ID is automatically extracted from the authentication token.**
        No ID parameter required.
        Supported formats: JPEG, PNG, GIF, WebP. Max size: 5MB.
      security:
        - bearerAuth: []
        - csrfToken: []
      consumes:
        - multipart/form-data
      parameters:
        - name: image
          in: formData
          required: true
          type: file
          description: Image file (JPEG, PNG, GIF, WebP - max 5MB)
      responses:
        200:
          description: Image uploaded successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: Profile image uploaded successfully
        400:
          description: No file uploaded or invalid file type
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated
        403:
          description: CSRF token invalid
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: User not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

  /v1/me/send-verification-code:
      post:
        tags:
          - current users
        summary: Send email verification code
        description: Sends a 6-digit verification code to the provided email address. Blocks disposable email addresses. No authentication required.
        parameters:
          - name: body
            in: body
            required: true
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to send verification code
                  example: "user@example.com"
        responses:
          200:
            description: Verification code sent to your email
          400:
            description: Disposable email or validation error
          404:
            description: User not found
          500:
            description: Server error

  /v1/me/verify-email:
      post:
        tags:
          - current users
        summary: Verify email with code
        description: |
          Submits the 6-digit code sent to the user's email to verify the email address. No authentication required.
        parameters:
          - name: body
            in: body
            required: true
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to verify
                  example: "user@example.com"
                code:
                  type: string
                  description: 6-digit verification code sent to email
                  example: "123456"
        responses:
          200:
            description: Email verified successfully
          400:
            description: Invalid or expired code
          404:
            description: User not found
          500:
            description: Server error
 
# ============================================
# ADMIN SERVICES ENDPOINTS
# ============================================

  /v1/admin-services/stats:
    get:
      tags:
        - admin services
      summary: Get admin statistics
      security:
        - bearerAuth: []
      responses:
        200:
          description: Admin statistics retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  totalUsers:
                    type: integer
                  activeUsers:
                    type: integer
                  blockedUsers:
                    type: integer
                  adminCount:
                    type: integer
                  clientCount:
                    type: integer
                  loungeCount:
                    type: integer
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Server error

  /v1/admin-services/health:
    get:
      tags:
        - admin services
      summary: Get system health status
      security:
        - bearerAuth: []
      responses:
        200:
          description: System health check completed
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                  uptime:
                    type: number
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Server error

  /v1/admin-services/activity-log:
    get:
      tags:
        - admin services
      summary: Get user activity log
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          type: integer
          default: 100
          description: Maximum number of records to return
      responses:
        200:
          description: User activity log retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
              count:
                type: integer
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Server error

  /v1/admin-services/dashboard:
    get:
      tags:
        - admin services
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        200:
          description: Dashboard statistics retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  totalUsers:
                    type: integer
                  newUsersThisMonth:
                    type: integer
                  activeUsers:
                    type: integer
                  blockedUsers:
                    type: integer
                  usersByType:
                    type: object
                  timestamp:
                    type: string
                    format: date-time
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Server error

  /v1/admin-services/users/{userId}/clear-sessions:
    post:
      tags:
        - admin services
      summary: Clear all user sessions
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: User ID
      responses:
        200:
          description: User sessions cleared successfully
          schema:
            $ref: '#/definitions/UserResponse'
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        404:
