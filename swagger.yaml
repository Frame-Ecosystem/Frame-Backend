# ============================================
# SERVICE SUGGESTIONS ENDPOINTS
# ============================================

  /v1/service-suggestions:
    get:
      tags:
        - service-suggestions
      summary: Get all service suggestions (Admin only)
      description: Retrieve all service suggestions with optional filtering and pagination. Admin access required.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          type: integer
          minimum: 1
          default: 1
          description: Page number for pagination
        - name: limit
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Number of items per page
        - name: status
          in: query
          type: string
          enum: [pending, rejected, implemented]
          description: Filter by suggestion status
        - name: loungeId
          in: query
          type: string
          description: Filter by lounge ID
      responses:
        200:
          description: Service suggestions retrieved successfully
          schema:
            type: object
            properties:
              suggestions:
                type: array
                items:
                  $ref: '#/definitions/ServiceSuggestionResponse'
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    example: 25
                  pages:
                    type: integer
                    example: 3
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        500:
          description: Server error
    post:
      tags:
        - service-suggestions
      summary: Create a service suggestion (Lounge only)
      description: Create a new service suggestion. Only lounge owners can create suggestions.
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateServiceSuggestionDto'
      responses:
        201:
          description: Service suggestion created successfully
          schema:
            $ref: '#/definitions/ServiceSuggestionResponse'
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - Lounge access required
        500:
          description: Server error

