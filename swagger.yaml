    put:
      tags: [queues]
      summary: Update person status in queue
      operationId: updatePersonStatus
      description: |
        Valid transitions:
        - `waiting` â†’ `inService` (start serving)
        - `waiting` â†’ `absent` (no-show)
        - `inService` â†’ `completed` (done)
        - `absent` â†’ `waiting` (arrived late)
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: bookingId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateQueuePersonDto'
      responses:
        200:
          description: Status updated
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Queue'
              message:
                type: string
        400:
          description: Invalid status transition
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Queue or person not found
        500:
          description: Server error
    delete:
      tags: [queues]
      summary: Remove person from queue
      operationId: removePersonFromQueue
      description: Removes a person from the queue. Remaining positions auto-reorder.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: bookingId
          in: path
          required: true
          type: string
      responses:
        200:
          description: Person removed
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Queue'
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Queue or person not found
        500:
          description: Server error

