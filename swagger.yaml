                        type: string
                        example: "507f1f77bcf86cd799439011"
                      loungeTitle:
                        type: string
                        example: "Elite Hair Salon"
                      email:
                        type: string
                        example: "lounge@example.com"
                  agents:
                    type: array
                    items:
                      type: object
