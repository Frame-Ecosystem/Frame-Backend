swagger: "2.0"
info:
  title: Frame Beauty API
  version: 1.1.7
  description: |
    **Frame Beauty** — Enterprise backend API for the Frame Beauty salon & booking platform.

    Frame Beauty powers lounge & salon management, booking, queue management,
    social content sharing, and discovery.

    ## Authentication
    Most endpoints require a Bearer token in the `Authorization` header.
    Tokens are obtained via `/v1/auth/login` or Google OAuth.
    Access tokens expire in **15 minutes**. Use `/v1/auth/refresh-token` to rotate.

    ## CSRF Protection
    Mutating endpoints (POST, PUT, PATCH, DELETE) require a CSRF token
    in the `X-CSRF-Token` header when using cookie-based authentication.

    ## Rate Limiting
    Sensitive endpoints are rate-limited per IP:
    | Endpoint | Limit |
    |----------|-------|
    | Login | 10 / 15 min |
    | Signup | 5 / hour |
    | Forgot Password | 3 / 15 min |
    | Change Password | 5 / 15 min |
    | Content creation | 10 / hour |
    | Likes & follows | 30 / min |
    | Comments | 20 / min |
    | Reports | 5 / hour |

    ## Account Security
    - Accounts lock after **5 failed login attempts** for 15 minutes
    - Blocked accounts cannot authenticate or refresh tokens
    - Password changes invalidate **all** existing sessions
    - Refresh tokens are rotated on every use (one-time use)

    ## Error Format
    ```json
    { "message": "Human-readable message", "code": "ERROR_CODE" }
    ```

    ### Common Error Codes
    | Code | Meaning |
    |------|---------|
    | INVALID_CREDENTIALS | Wrong email/phone or password |
    | ACCOUNT_LOCKED | Too many failed attempts  -  locked 15 min |
    | ACCOUNT_BLOCKED | Account disabled by admin |
    | EMAIL_EXISTS | Email already registered |
    | INVALID_TOKEN | Expired or invalid token |
    | VALIDATION_ERROR | Request body failed validation |
  termsOfService: https://framebeauty.com/terms
  contact:
    name: Frame Beauty Team
    url: https://github.com/Frame-Ecosystem
    email: api@framebeauty.com
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC

host: api.framebeauty.com
basePath: /
schemes:
  - https
  - http
consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "JWT access token. Format: `Bearer <token>`"
  csrfToken:
    type: apiKey
    name: X-CSRF-Token
    in: header
    description: CSRF protection token required for mutating operations with cookie auth

tags:
  - name: health
    description: Service health and readiness probes
  - name: auth
    description: Authentication, registration, password management, and Google OAuth
  - name: admin
    description: Admin-only user management  -  CRUD, block/unblock users
  - name: admin-services
    description: Admin dashboard, system health, audit logs, and advanced user tools
  - name: current-user
    description: Authenticated user profile, settings, and account management
  - name: clients
    description: Client browsing  -  view lounges, profiles, and lounge services
  - name: agents
    description: Agent (lounge employee) management
  - name: lounges
    description: Lounge-owner-specific operations
  - name: lounge-services
    description: Lounge service CRUD, pricing, scheduling, and profile management
  - name: services
    description: Global service catalog management (admin)
  - name: service-categories
    description: Service category management (admin)
  - name: service-suggestions
    description: Lounge-initiated service suggestions and admin approval workflow
  - name: bookings
    description: Appointment booking, walk-in queue booking, and availability checks
  - name: queues
    description: Daily queue management  -  add, reorder, update status, remove persons
  - name: notifications
    description: Push notifications, device token registration, and read tracking
  - name: ratings
    description: Client-to-lounge rating system (1-5 stars with optional comment)
  - name: likes
    description: Client-to-lounge like/favorite system
  - name: follows
    description: User follow/unfollow social graph
  - name: posts
    description: Image/text post creation, likes, saves, and moderation
  - name: reels
    description: Short video reel creation, likes, saves, and moderation
  - name: comments
    description: Comments and threaded replies on posts and reels
  - name: feed
    description: Content feed, explore, saved content, and hashtag discovery
  - name: reports
    description: Content reporting and admin moderation

# =====================================================================
#  PATHS
# =====================================================================
paths:

  # ==================================================================
  #  HEALTH
  # ==================================================================
  /:
    get:
      tags: [health]
      summary: API root
      operationId: getRoot
      responses:
        200:
          description: API is running
          schema:
            type: object
            properties:
              message:
                type: string
                example: "OK"

  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: getHealth
      responses:
        200:
          description: Service is healthy
          schema:
            type: object
            properties:
              status:
                type: string
                example: "OK"
              uptime:
                type: number
                example: 12345.67
              timestamp:
                type: string
                format: date-time

  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReady
      description: Verifies database connectivity and service readiness.
      responses:
        200:
          description: Service is ready
          schema:
            type: object
            properties:
              status:
                type: string
                example: "ready"
        503:
          description: Service not ready (e.g. database disconnected)

  # ==================================================================
  #  AUTH
  # ==================================================================
  /v1/auth/signup:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: signUp
      description: |
        Creates a new account and sends a verification email with a magic link.
        Rate limited to **5 per hour per IP**.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateUserDto'
      responses:
        201:
          description: Registration successful  -  verification email sent
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: "Signup successful"
        400:
          description: Validation error
          schema:
            $ref: '#/definitions/ErrorResponse'
        409:
          description: Email already registered
          schema:
            $ref: '#/definitions/ErrorResponse'
        429:
          description: Too many signup attempts
        500:
          description: Server error

  /v1/auth/verify:
    get:
      tags: [auth]
      summary: Verify email via magic link
      operationId: verifyMagicLink
      description: Verifies the user's email using the token from the magic link. Rate limited.
      parameters:
        - name: token
          in: query
          required: true
          type: string
          description: Verification token from the email magic link
      responses:
        200:
          description: Email verified successfully
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Email verified successfully"
        400:
          description: Invalid or expired verification token
          schema:
            $ref: '#/definitions/ErrorResponse'
        429:
          description: Too many verification attempts
        500:
          description: Server error

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      operationId: logIn
      description: |
        Authenticate with email or phone number and password.

        **Security:**
        - Account locks after 5 failed attempts for 15 minutes
        - Blocked accounts are rejected
        - Rate limited: 10 per 15 min per IP

        **Token delivery:**
        - **Web:** Refresh token set as `httpOnly` cookie; access token in body
        - **Mobile:** Both tokens returned in response body
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/LoginUserDto'
      responses:
        200:
          description: Login successful
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token (15 min expiry)
                    example: "eyJhbGciOiJIUzI1NiIs..."
                  refreshToken:
                    type: string
                    description: Refresh token (in body for mobile; also set as httpOnly cookie)
                  user:
                    $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: "Login successful"
          headers:
            Set-Cookie:
              type: string
              description: "refreshToken=<token>; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth"
        401:
          description: Invalid credentials
          schema:
            $ref: '#/definitions/ErrorResponse'
        403:
          description: Account locked or blocked
          schema:
            $ref: '#/definitions/ErrorResponse'
        429:
          description: Too many login attempts
        500:
          description: Server error

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out current session
      operationId: logOut
      description: Invalidates the current refresh token and clears the cookie.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logged out successfully
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Logged out successfully"
        401:
          description: Unauthorized
        500:
          description: Server error

  /v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Log out all devices
      operationId: logOutAllDevices
      description: Invalidates **all** refresh tokens for the user, logging out every device.
      security:
        - bearerAuth: []
      responses:
        200:
          description: All sessions invalidated
          schema:
            type: object
            properties:
              message:
                type: string
                example: "All sessions invalidated"
        401:
          description: Unauthorized
        500:
          description: Server error

  /v1/auth/refresh-token:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      description: |
        Exchange a valid refresh token for a new access token and rotated refresh token.

        **Web:** Reads refresh token from `httpOnly` cookie.
        **Mobile:** Reads from `refreshToken` field in request body.

        Blocked users are rejected.
      parameters:
        - name: body
          in: body
          required: false
          schema:
            type: object
            properties:
              refreshToken:
                type: string
                description: Refresh token (for mobile clients without cookie support)
      responses:
        200:
          description: Token refreshed
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIs..."
                  refreshToken:
                    type: string
                    description: Rotated refresh token (body for mobile, cookie for web)
              message:
                type: string
                example: "Token refreshed"
          headers:
            Set-Cookie:
              type: string
              description: New rotated refresh token cookie
        401:
          description: Invalid or expired refresh token
        403:
          description: Account blocked
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error

  /v1/auth/forgot-password:
    post:
      tags: [auth]
      summary: Request password reset email
      operationId: forgotPassword
      description: |
        Sends a password reset link to the email address. Always returns success
        to prevent email enumeration. Rate limited: **3 per 15 min per IP**.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ForgotPasswordDto'
      responses:
        200:
          description: Success (always returned regardless of email existence)
          schema:
            type: object
            properties:
              message:
                type: string
                example: "If an account with that email exists, a password reset link has been sent"
        429:
          description: Too many password reset requests
        500:
          description: Server error

  /v1/auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password with token
      operationId: resetPassword
      description: |
        Resets the password using the token from the forgot-password email.
        Invalidates **all** existing sessions after reset.

        Password: 8-128 chars, uppercase, lowercase, number, special character (`@$!%*?&`).
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ResetPasswordDto'
      responses:
        200:
          description: Password reset  -  all sessions invalidated
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Password reset successfully"
        400:
          description: Invalid/expired token or weak password
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error

  /v1/auth/google/login:
    get:
      tags: [auth]
      summary: Google OAuth login
      operationId: googleLogin
      description: Redirects to Google OAuth consent screen for existing user login.
      responses:
        302:
          description: Redirect to Google OAuth

  /v1/auth/google/signup:
    get:
      tags: [auth]
      summary: Google OAuth signup
      operationId: googleSignup
      description: Redirects to Google OAuth consent screen for new user registration.
      responses:
        302:
          description: Redirect to Google OAuth

  /v1/auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth callback
      operationId: googleAuthCallback
      description: |
        Handles the OAuth callback from Google. On success, issues tokens and
        redirects to the frontend. Blocked users are rejected.
      parameters:
        - name: code
          in: query
          type: string
          description: OAuth authorization code from Google
      responses:
        302:
          description: Redirect to frontend with tokens
        401:
          description: Authentication failed
        403:
          description: Account blocked

  # ==================================================================
  #  ADMIN  -  User Management
  # ==================================================================
  /v1/admin/users:
    get:
      tags: [admin]
      summary: Get all users
      operationId: adminGetUsers
      description: Retrieve all users in the system. Admin only.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Users retrieved
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/UserResponse'
              count:
                type: integer
                example: 42
              message:
                type: string
                example: "findAll"
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error
    post:
      tags: [admin]
      summary: Create a user (admin)
      operationId: adminCreateUser
      description: Admin creates a user with a specified type (user, client, lounge, admin).
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AdminCreateUserDto'
      responses:
        201:
          description: User created
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: "User created successfully"
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        409:
          description: Email already exists
        500:
          description: Server error

  /v1/admin/users/{id}:
    get:
      tags: [admin]
      summary: Get user by ID
      operationId: adminGetUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
      responses:
        200:
          description: User retrieved
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: User not found
        500:
          description: Server error
    put:
      tags: [admin]
      summary: Update user (admin)
      operationId: adminUpdateUser
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateUserDto'
      responses:
        200:
          description: User updated
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: User not found
        500:
          description: Server error
    delete:
      tags: [admin]
      summary: Delete user (admin)
      operationId: adminDeleteUser
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
      responses:
        200:
          description: User deleted
          schema:
            type: object
            properties:
              message:
                type: string
                example: "User deleted successfully"
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: User not found
        500:
          description: Server error

  /v1/admin/users/{id}/block:
    patch:
      tags: [admin]
      summary: Block or unblock user
      operationId: adminChangeUserBlockedState
      description: Toggle a user's blocked state. Blocked users cannot authenticate.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
      responses:
        200:
          description: User block state changed
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: "User blocked successfully"
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: User not found
        500:
          description: Server error

  /v1/admin/session-info:
    get:
      tags: [admin]
      summary: Get online users
      operationId: adminGetOnlineUsers
      description: Retrieve currently online users and their session information.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Online users retrieved
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/OnlineUserInfo'
              count:
                type: integer
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

  /v1/admin/lounges/names:
    get:
      tags: [admin]
      summary: Get all lounge names
      operationId: adminGetAllLoungeNames
      description: Retrieve a lightweight list of all lounges (ID + name only). Useful for dropdowns.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lounge names retrieved
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    loungeTitle:
                      type: string
                      example: "Elite Hair Salon"
              count:
                type: integer
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

  # ==================================================================
  #  ADMIN SERVICES  -  Dashboard & Tools
  # ==================================================================
  /v1/admin-services/stats:
    get:
      tags: [admin-services]
      summary: Get admin service stats
      operationId: adminGetStats
      security:
        - bearerAuth: []
      responses:
        200:
          description: Stats retrieved
          schema:
            type: object
            properties:
              data:
                type: object
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

  /v1/admin-services/health:
    get:
      tags: [admin-services]
      summary: Get system health details
      operationId: adminGetSystemHealth
      description: Detailed system health including database status, memory usage, and uptime.
      security:
        - bearerAuth: []
      responses:
        200:
          description: System health retrieved
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  database:
                    type: string
                    example: "connected"
                  memoryUsage:
                    type: object
                  uptime:
                    type: number
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

  /v1/admin-services/activity-log:
    get:
      tags: [admin-services]
      summary: Get user activity log
      operationId: adminGetActivityLog
      security:
        - bearerAuth: []
      responses:
        200:
          description: Activity log retrieved
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

  /v1/admin-services/dashboard:
    get:
      tags: [admin-services]
      summary: Get dashboard statistics
      operationId: adminGetDashboard
      description: Aggregate dashboard stats  -  user counts, booking counts, revenue, etc.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Dashboard stats retrieved
          schema:
            type: object
            properties:
              data:
                type: object
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

  /v1/admin-services/users/{userId}/clear-sessions:
    post:
      tags: [admin-services]
      summary: Clear all sessions for a user
      operationId: adminClearUserSessions
      description: Invalidates all refresh tokens for the specified user, forcing re-login on all devices.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: Target user ID
      responses:
        200:
          description: Sessions cleared
          schema:
            type: object
            properties:
              message:
                type: string
                example: "User sessions cleared"
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: User not found
        500:
          description: Server error

  /v1/admin-services/users/{userId}/reset-password:
    post:
      tags: [admin-services]
      summary: Admin reset user password
      operationId: adminResetUserPassword
      description: Resets a user's password and sends them a notification.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: Target user ID
      responses:
        200:
          description: Password reset
          schema:
            type: object
            properties:
              message:
                type: string
                example: "User password has been reset"
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: User not found
        500:
          description: Server error

  /v1/admin-services/users/{userId}/export:
    get:
      tags: [admin-services]
      summary: Export user data
      operationId: adminExportUserData
      description: Export all data associated with a user (profile, bookings, activity).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: Target user ID
      responses:
        200:
          description: User data exported
          schema:
            type: object
            properties:
              data:
                type: object
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: User not found
        500:
          description: Server error

  /v1/admin-services/audit-log:
    post:
      tags: [admin-services]
      summary: Create audit log entry
      operationId: adminCreateAuditLog
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              action:
                type: string
                description: Action performed
                example: "USER_BLOCKED"
              details:
                type: string
                description: Details about the action
      responses:
        201:
          description: Audit log created
          schema:
            type: object
            properties:
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

  # ==================================================================
  #  CURRENT USER  -  /v1/me
  # ==================================================================
  /v1/me:
    get:
      tags: [current-user]
      summary: Get current user profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile retrieved
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: "User profile retrieved"
        401:
          description: Unauthorized
        500:
          description: Server error
    put:
      tags: [current-user]
      summary: Update current user profile
