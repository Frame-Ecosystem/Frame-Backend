        - service-suggestions
      summary: Admin approve service suggestion and create service/lounge service
      description: Approve a service suggestion and automatically create a service and lounge service. Admins can optionally provide a custom service name, otherwise the suggestion name will be used. Only admins can perform this action.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Service suggestion ID
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AdminApproveServiceSuggestionDto'
      responses:
        200:
          description: Service suggestion approved and implemented successfully
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  suggestion:
                    $ref: '#/definitions/ServiceSuggestionResponse'
                  service:
                    $ref: '#/definitions/ServiceResponse'
                  loungeService:
                    $ref: '#/definitions/LoungeServiceResponse'
              message:
                type: string
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        404:
          description: Service suggestion not found
        409:
          description: Service already exists
        500:
          description: Server error

  /v1/service-suggestions/{id}:
    delete:
      tags:
        - service-suggestions
      summary: Delete a service suggestion
      description: Delete a service suggestion. Lounges can delete their own suggestions, admins can delete any suggestion.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Service suggestion ID
      responses:
        200:
          description: Service suggestion deleted successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden - Not authorized to delete this suggestion
        404:
          description: Service suggestion not found
        500:
          description: Server error

