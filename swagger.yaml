  Agent:
    type: object
    description: Agent model representing a lounge employee/agent
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      agentName:
        type: string
        description: Unique name identifier for the agent
        example: "john_doe"
      password:
        type: string
        description: Agent's password (not returned in responses)
        example: "hashed_password"
      loungeId:
        type: string
