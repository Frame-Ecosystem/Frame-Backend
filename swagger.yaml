                          example: "507f1f77bcf86cd799439012"
                        agentName:
                          type: string
                          example: "john_doe"
                        loungeId:
                          type: string
                          example: "507f1f77bcf86cd799439011"
                        profileImage:
                          type: object
                          properties:
                            url:
                              type: string
                              example: "https://cloudinary.com/image.jpg"
                            publicId:
                              type: string
                              example: "agents/agent_123"
                        isBlocked:
                          type: boolean
                          example: false
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
