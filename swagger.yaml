          required: true
          schema:
            $ref: '#/definitions/UpdateServiceSuggestionStatusDto'
      responses:
        200:
          description: Service suggestion status updated successfully
          schema:
            $ref: '#/definitions/ServiceSuggestionResponse'
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin access required
        404:
          description: Service suggestion not found
        500:
          description: Server error

  /v1/service-suggestions/{id}:
    delete:
      tags:
        - service-suggestions
      summary: Delete a service suggestion
      description: Delete a service suggestion. Lounges can delete their own suggestions, admins can delete any suggestion.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Service suggestion ID
      responses:
        200:
          description: Service suggestion deleted successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden - Not authorized to delete this suggestion
        404:
          description: Service suggestion not found
        500:
          description: Server error

# ============================================
# DEFINITIONS
# ============================================

definitions:
  CreateUserDto:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
        description: User email address (will be normalized to lowercase)
        example: user@example.com
      password:
        type: string
        minLength: 8
        maxLength: 128
        description: |
          Password must contain at least 8 characters with uppercase, lowercase, number, and special character (@$!%*?&)
        example: SecureP@ss123
      phoneNumber:
        type: string
        description: Phone number in international format (optional)
        example: "+21612345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
        default: unisex
        description: User gender (optional)
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri
        description: URL to profile image (optional)

  AdminCreateUserDto:
    allOf:
      - $ref: '#/definitions/CreateUserDto'
      - type: object
        properties:
          type:
            type: string
            enum: [user, client, lounge, admin]
            default: user
            description: User type

  UpdateUserDto:
    type: object
    description: All fields are optional. Password and user type cannot be changed.
    properties:
      email:
        type: string
        format: email
        example: newemail@example.com
      phoneNumber:
        type: string
        example: "+21698765432"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri

      LoginUserDto:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            description: Email address
            example: user@example.com
          password:
            type: string
            description: User password
            example: SecureP@ss123

  ChangePasswordDto:
    type: object
    required:
      - currentPassword
      - newPassword
      - newPasswordConfirm
    properties:
      currentPassword:
        type: string
        description: Current password
        example: OldP@ssword123
      newPassword:
        type: string
        minLength: 8
        maxLength: 128
        description: New password (same requirements as signup)
        example: NewSecureP@ss456
      newPasswordConfirm:
        type: string
        description: Confirm new password (must match newPassword)
        example: NewSecureP@ss456

  DeleteAccountDto:
    type: object
    required:
      - password
    properties:
      password:
        type: string
        description: Current password for verification before account deletion
        example: MyCurrentP@ss123

  LocationDto:
    type: object
    required:
      - latitude
      - longitude
      - address
      - placeId
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
        description: Latitude coordinate
        example: 36.8065
      longitude:
        type: number
        minimum: -180
        maximum: 180
        description: Longitude coordinate
        example: 10.1815
      address:
        type: string
        maxLength: 500
        description: Full address
        example: 123 Main Street, Tunis, Tunisia
      placeId:
        type: string
        description: Google Places ID
        example: ChIJN1t_tDeuEmsRUsoyG83frY4

  UserResponse:
    type: object
    description: User object with sensitive fields removed (no password, no refreshTokens)
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      email:
        type: string
        example: user@example.com
      phoneNumber:
        type: string
        example: "+21612345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      # Note: User type is determined by 'type' field
      # Admin users have type: 'admin', Client users have type: 'client', Lounge users have type: 'lounge'
      # Regular users have type: 'user'
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        example: https://res.cloudinary.com/xxx/image/upload/v123/profile_abc.jpg
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  OnlineUserInfo:
    type: object
    properties:
      _id:
        type: string
      email:
        type: string
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: string

  ErrorResponse:
    type: object
    properties:
      message:
        type: string
        description: User-friendly error message
        example: Email already registered
      code:
        type: string
        description: Error code for client-side handling
        example: EMAIL_EXISTS
  LoungeServiceResponse:
    type: object
    description: Lounge service object
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      loungeId:
        type: string
        description: Reference to User (lounge type)
        example: 507f1f77bcf86cd799439010
      serviceId:
        type: string
        description: Reference to Service
        example: 507f1f77bcf86cd799439012
      price:
        type: number
        description: Price in smallest currency unit (e.g., cents for USD)
        example: 2500
      duration:
        type: integer
        description: Duration in minutes
        example: 30
      gender:
        type: string
        enum: [men, women, unisex, kids]
        description: Gender category for the service
        example: men
      description:
        type: string
        description: Service description
        example: "Premium haircut service"
      isActive:
        type: boolean
        description: Service active status
        example: true
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  ServiceResponse:
    type: object
    description: Service object
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      name:
        type: string
        description: Service name
        example: "Premium Haircut"
      categoryId:
        type: string
        description: Reference to ServiceCategory
        example: 507f1f77bcf86cd799439012
      baseDuration:
        type: integer
        description: Base duration in minutes
        example: 30
      status:
        type: string
        enum: [active, inactive]
        description: Service status
        example: "active"
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  ServiceCategoryResponse:
    type: object
    description: Service category object
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      name:
        type: string
        description: Category name
        example: "Haircuts"
      description:
        type: string
        description: Category description
        example: "Various haircut services for different styles and lengths"
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  CreateServiceSuggestionDto:
    type: object
    required:
      - name
      - description
      - category
    properties:
      name:
        type: string
        minLength: 2
        maxLength: 100
        description: Name of the suggested service
        example: "Brazilian Blowout"
      description:
        type: string
        minLength: 10
        maxLength: 1000
        description: Detailed description of the suggested service
        example: "A smoothing treatment that makes hair straight, shiny, and frizz-free for up to 12 weeks"
      category:
        type: string
        minLength: 2
        maxLength: 50
        description: Service category name
        example: "Hair Treatments"
      estimatedPrice:
        type: number
        minimum: 0
        description: Estimated price in smallest currency unit (optional)
        example: 15000
      estimatedDuration:
        type: integer
        minimum: 15
        maximum: 480
        description: Estimated duration in minutes (optional)
        example: 120
      targetGender:
        type: string
        enum: [men, women, unisex, kids]
        description: Target gender for the service (optional)
        example: women

  UpdateServiceSuggestionStatusDto:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        enum: [pending, approved, rejected, implemented]
        description: New status for the service suggestion
        example: approved
      adminNotes:
        type: string
        maxLength: 500
        description: Optional notes from admin about the decision
        example: "Great suggestion! We'll implement this in our premium package."

  ServiceSuggestionResponse:
    type: object
    description: Service suggestion object
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      loungeId:
        type: string
        description: Reference to User (lounge type)
        example: 507f1f77bcf86cd799439010
      loungeName:
        type: string
        description: Name of the lounge that made the suggestion
        example: "Elegant Cuts Salon"
      name:
        type: string
        description: Suggested service name
        example: "Brazilian Blowout"
      description:
        type: string
        description: Service description
        example: "A smoothing treatment that makes hair straight, shiny, and frizz-free for up to 12 weeks"
      category:
        type: string
        description: Service category
        example: "Hair Treatments"
      estimatedPrice:
        type: number
        description: Estimated price in smallest currency unit
        example: 15000
      estimatedDuration:
        type: integer
        description: Estimated duration in minutes
        example: 120
      targetGender:
        type: string
        enum: [men, women, unisex, kids]
        description: Target gender for the service
        example: women
      status:
        type: string
        enum: [pending, approved, rejected, implemented]
        description: Current status of the suggestion
        example: pending
      adminNotes:
        type: string
        description: Notes from admin about the decision
        example: "Great suggestion! We'll implement this in our premium package."
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time