      summary: Add person to queue
      operationId: addPersonToQueue
      description: Add a booking (person) to an agent's queue. Booking must have `inQueue` status.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AddToQueueDto'
      responses:
        201:
          description: Person added to queue
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Queue'
              message:
                type: string
        400:
          description: Invalid booking status or already in queue
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin or lounge only
        404:
          description: Booking not found
        500:
          description: Server error

  /v1/queues/agent/{agentId}/persons/{bookingId}:
    put:
      tags: [queues]
      summary: Update person status in queue
      operationId: updatePersonStatus
      description: |
        Valid transitions:
        - `waiting` â†’ `inService` (start serving)
        - `waiting` â†’ `absent` (no-show)
        - `inService` â†’ `completed` (done)
        - `absent` â†’ `waiting` (arrived late)
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: bookingId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateQueuePersonDto'
      responses:
        200:
          description: Status updated
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Queue'
              message:
                type: string
        400:
          description: Invalid status transition
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Queue or person not found
        500:
          description: Server error
    delete:
      tags: [queues]
      summary: Remove person from queue
      operationId: removePersonFromQueue
      description: Removes a person from the queue. Remaining positions auto-reorder.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: bookingId
          in: path
          required: true
          type: string
      responses:
        200:
          description: Person removed
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Queue'
              message:
                type: string
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Queue or person not found
        500:
          description: Server error

  /v1/queues/agent/{agentId}/persons/{bookingId}/reorder:
    put:
      tags: [queues]
      summary: Reorder person in queue
      operationId: reorderPerson
      description: Move a person to a new position in the queue. Other positions auto-adjust.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: bookingId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ReorderQueuePersonDto'
      responses:
        200:
          description: Person reordered
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Queue'
              message:
                type: string
        400:
          description: Invalid position
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Queue or person not found
        500:
          description: Server error

  /v1/queues/populate:
    post:
      tags: [queues]
      summary: Populate daily queues (admin)
      operationId: populateDailyQueues
      description: |
        Manually trigger daily queue population. Finds confirmed bookings for today,
        sets status to `inQueue`, and adds them to agent queues.
        Normally runs automatically via cron at 00:01.
      security:
        - bearerAuth: []
        - csrfToken: []
      responses:
        200:
          description: Queues populated
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  processed:
                    type: integer
                    example: 12
                  errors:
                    type: array
                    items:
                      type: string
              message:
                type: string
                example: "Daily queues populated: 12 bookings processed"
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        500:
          description: Server error

