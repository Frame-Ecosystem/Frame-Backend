        500:
          description: Server error
    get:
      tags: [chat]
      summary: List all conversations
      operationId: getConversations
      description: Returns paginated list of the authenticated user's conversations, sorted by latest message.
      security:
        - bearerAuth: []
      parameters:
        - name: page
