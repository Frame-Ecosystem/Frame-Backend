# ============================================
# DEFINITIONS
# ============================================

definitions:
  CreateUserDto:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
        description: User email address (will be normalized to lowercase)
        example: user@example.com
      password:
        type: string
        minLength: 8
        maxLength: 128
        description: |
          Password must contain at least 8 characters with uppercase, lowercase, number, and special character (@$!%*?&)
        example: SecureP@ss123
      phoneNumber:
        type: string
        pattern: '^\d{8}$'
        description: Phone number (exactly 8 digits, optional)
        example: "12345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
        default: unisex
        description: User gender (optional)
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri
        description: URL to profile image (optional)

  AdminCreateUserDto:
    allOf:
      - $ref: '#/definitions/CreateUserDto'
      - type: object
        properties:
          type:
            type: string
            enum: [user, client, lounge, admin]
            default: user
            description: User type

  UpdateUserDto:
    type: object
    description: All fields are optional. Password and user type cannot be changed.
    properties:
      email:
        type: string
        format: email
        example: newemail@example.com
      phoneNumber:
        type: string
        pattern: '^\d{8}$'
        example: "98765432"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri

      LoginUserDto:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            description: Email address
            example: user@example.com
          password:
            type: string
            description: User password
            example: SecureP@ss123

  ChangePasswordDto:
    type: object
    required:
      - currentPassword
      - newPassword
      - newPasswordConfirm
    properties:
      currentPassword:
        type: string
        description: Current password
        example: OldP@ssword123
      newPassword:
        type: string
        minLength: 8
        maxLength: 128
        description: New password (same requirements as signup)
        example: NewSecureP@ss456
      newPasswordConfirm:
        type: string
        description: Confirm new password (must match newPassword)
        example: NewSecureP@ss456

  DeleteAccountDto:
    type: object
    required:
      - password
    properties:
      password:
        type: string
        description: Current password for verification before account deletion
        example: MyCurrentP@ss123

  LocationDto:
    type: object
    required:
      - latitude
      - longitude
      - address
      - placeId
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
        description: Latitude coordinate
        example: 36.8065
      longitude:
        type: number
        minimum: -180
        maximum: 180
        description: Longitude coordinate
        example: 10.1815
      address:
        type: string
        maxLength: 500
        description: Full address
        example: 123 Main Street, Tunis, Tunisia
      placeId:
        type: string
        description: Google Places ID or custom place identifier
        example: ChIJN1t_tDeuEmsRUsoyG83frY4
      placeName:
        type: string
        maxLength: 200
        description: Human-readable place name (optional)
        example: "Elite Hair Salon - Downtown Branch"

  OpeningHours:
    type: object
    description: Opening hours for a specific day
    properties:
      from:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        description: Opening time in HH:MM format (24-hour)
        example: "09:00"
      to:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        description: Closing time in HH:MM format (24-hour)
        example: "18:00"

  UserResponse:
    type: object
    description: User object with sensitive fields removed (no password, no refreshTokens)
    properties:
      _id:
        type: string
        example: 507f1f77bcf86cd799439011
      email:
        type: string
        example: user@example.com
      phoneNumber:
        type: string
        pattern: '^\\d{8}$'
        example: "12345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      # Note: User type is determined by 'type' field
      # Admin users have type: 'admin', Client users have type: 'client', Lounge users have type: 'lounge'
      # Regular users have type: 'user'
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        example: https://res.cloudinary.com/xxx/image/upload/v123/profile_abc.jpg
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: string
      createdAt:
        type: string
