        404:
          description: Conversation not found

  /v1/chat/conversations/{id}/messages/search:
    get:
      tags: [chat]
      summary: Search messages in a conversation
      operationId: searchMessages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: q
          in: query
          required: true
          type: string
          maxLength: 200
          description: Full-text search query
        - name: limit
          in: query
          type: integer
          default: 20
          maximum: 50
      responses:
        200:
          description: Matching messages
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/MessageResponse'
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - not a participant

  /v1/chat/conversations/{id}/messages:
    get:
      tags: [chat]
      summary: Get messages in a conversation
      operationId: getMessages
      description: Returns cursor-paginated messages. Use `before` (message ID) for infinite scroll.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: page
          in: query
          type: integer
          default: 1
        - name: limit
          in: query
          type: integer
          default: 30
          maximum: 100
        - name: before
          in: query
          type: string
          description: Message ID cursor — return messages older than this ID
      responses:
        200:
          description: Message list
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/MessageResponse'
              pagination:
                $ref: '#/definitions/Pagination'
        401:
          description: Unauthorized
        403:
          description: Forbidden - not a participant
        404:
          description: Conversation not found
    post:
      tags: [chat]
      summary: Send a message
      operationId: sendMessage
      description: Send a text or file message. For image/file/audio use multipart/form-data with the `file` field.
      security:
        - bearerAuth: []
        - csrfToken: []
      consumes:
        - multipart/form-data
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: contentType
          in: formData
          required: true
          type: string
          enum: [text, image, file, audio]
        - name: text
          in: formData
          type: string
          maxLength: 4000
          description: Required when contentType is text
        - name: replyTo
          in: formData
          type: string
          description: Message ID being replied to
        - name: file
          in: formData
          type: file
          description: Attachment for image/file/audio content types
      responses:
        201:
          description: Message sent
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/MessageResponse'
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - not a participant
        404:
          description: Conversation not found

  /v1/chat/conversations/{id}/messages/{msgId}:
    patch:
      tags: [chat]
      summary: Edit a text message
      operationId: editMessage
      description: Edit message text. Sender only. Sets `editedAt` timestamp.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: msgId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/EditMessageDto'
      responses:
        200:
          description: Message edited
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/MessageResponse'
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - not sender
        404:
          description: Message not found
    delete:
      tags: [chat]
      summary: Delete a message
      operationId: deleteMessage
      description: Soft-delete. If `recallForEveryone` is true, removes it for all participants (sender only, within time limit).
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: msgId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: false
          schema:
            $ref: '#/definitions/DeleteMessageDto'
      responses:
        200:
          description: Message deleted
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Message not found

  /v1/chat/conversations/{id}/messages/{msgId}/reactions:
    post:
      tags: [chat]
      summary: React to a message (toggle)
      operationId: reactToMessage
      description: Adds or removes an emoji reaction. Sending the same emoji twice removes it.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: msgId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ReactToMessageDto'
      responses:
        200:
          description: Reaction toggled
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/MessageResponse'
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden - not a participant
        404:
          description: Message not found

  /v1/chat/conversations/{id}/typing:
    post:
      tags: [chat]
      summary: Broadcast typing indicator
      operationId: sendTypingIndicator
      description: Emits a typing event via Socket.IO to the other participant. No persistent state stored.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: Typing indicator sent
        401:
          description: Unauthorized
        403:
          description: Forbidden - not a participant

