              success:
                type: boolean
              data:
                type: object
                properties:
                  unavailableSlots:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2026-02-21"
                        unavailableTimes:
                          type: array
                          items:
