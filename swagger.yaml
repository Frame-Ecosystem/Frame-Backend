  /v1/lounge-services/lounge/{loungeId}/opening-hours:
    patch:
      tags:
        - lounge services
      summary: Patch opening hours for a lounge
      description: |
        Update specific opening hours for a lounge.
        This endpoint allows partial updates - you can update one or more days without affecting the others.
        The lounge must exist and be of type 'lounge'.
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: loungeId
          in: path
          required: true
          type: string
          description: Lounge ID (MongoDB ObjectId)
        - name: body
          in: body
          required: true
          schema:
            type: object
            description: Opening hours to update (only include days you want to modify)
            properties:
              monday:
                $ref: '#/definitions/OpeningHours'
              tuesday:
                $ref: '#/definitions/OpeningHours'
              wednesday:
                $ref: '#/definitions/OpeningHours'
              thursday:
                $ref: '#/definitions/OpeningHours'
              friday:
                $ref: '#/definitions/OpeningHours'
              saturday:
                $ref: '#/definitions/OpeningHours'
              sunday:
                $ref: '#/definitions/OpeningHours'
            example:
              monday:
                from: "09:00"
                to: "18:00"
              friday:
                from: "09:00"
                to: "20:00"
              saturday:
                from: "10:00"
                to: "14:00"
      responses:
        200:
          description: Opening hours updated successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/UserResponse'
              message:
                type: string
                example: Opening hours updated successfully
        400:
          description: Invalid request data or validation error
          schema:
            type: object
            properties:
              message:
