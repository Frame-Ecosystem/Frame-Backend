tags:
- name: users
  description: users API
- name: auth
  description: auth API

paths:
# [POST] signup
  /signup:
    post:
      tags:
      - auth
      summary: Sign Up
      parameters:
      - name: body
        in: body
        description: user Data
        required: true
        schema:
          $ref: '#/definitions/users'
      responses:
        201:
          description: 'Created'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [POST] login
  /login:
    post:
      tags:
      - auth
      summary: Log In
      parameters:
      - name: body
        in: body
        description: user Credentials (email or username with password)
        required: true
        schema:
          $ref: '#/definitions/login'
      responses:
        200:
          description: 'OK'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [POST] logout
  /logout:
    post:
      tags:
      - auth
      summary: Log Out
      responses:
        200:
          description: 'OK'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

# [GET] users
  /users:
    get:
      tags:
      - users
      summary: Find All Users
      responses:
        200:
          description: 'OK'
        500:
          description: 'Server Error'

# [POST] users
    post:
      tags:
      - users
      summary: Add User
      parameters:
      - name: body
        in: body
        description: user Data
        required: true
        schema:
          $ref: '#/definitions/users'
      responses:
        201:
          description: 'Created'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [GET] users/id
  /users/{id}:
    get:
      tags:
      - users
      summary: Find User By Id
      parameters:
      - name: id
        in: path
        description: User Id
        required: true
      responses:
        200:
          description: 'OK'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [PUT] users/id
    put:
      tags:
      - users
      summary: Update User By Id
      parameters:
      - name: id
        in: path
        description: user Id
        required: true
      - name: body
        in: body
        description: user Data
        required: true
        schema:
          $ref: '#/definitions/users'
      responses:
        200:
          description: 'OK'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [DELETE] users/id
    delete:
      tags:
      - users
      summary: Delete User By Id
      parameters:
      - name: id
        in: path
        description: user Id
        required: true
      responses:
        200:
          description: 'OK'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [PUT] users/id/location
  /users/{id}/location:
    put:
      tags:
      - users
      summary: Update User Location
      parameters:
      - name: id
        in: path
        description: user Id
        required: true
      - name: body
        in: body
        description: location Data (latitude, longitude, address, placeId)
        required: true
        schema:
          $ref: '#/definitions/location'
      responses:
        200:
          description: 'OK'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [GET] users/id/profile-image
  /users/{id}/profile-image:
    get:
      tags:
      - users
      summary: Get User Profile Image
      parameters:
      - name: id
        in: path
        description: user Id
        required: true
      responses:
        200:
          description: 'OK'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

# [POST] users/id/upload-profile-image
  /users/{id}/upload-profile-image:
    post:
      tags:
      - users
      summary: Upload User Profile Image
      consumes:
        - multipart/form-data
      parameters:
      - name: id
        in: path
        description: user Id
        required: true
      - name: profileImage
        in: formData
        description: Profile image file (jpeg, png, gif, webp - max 5MB)
        required: true
        type: file
      responses:
        200:
          description: 'OK'
        400:
          description: 'Bad Request'
        500:
          description: 'Server Error'

# [GET] users/token
  /user/token:
    get:
      tags:
      - users
      summary: Get user by token
      description: Retrieve user details using a JWT token.
      security:
        - bearerAuth: []
      responses:
        200:
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: User retrieved successfully
        400:
          description: Token is missing
        401:
          description: Invalid token
        404:
          description: User not found

# definitions
definitions:
  location:
    type: object
    properties:
      latitude:
        type: number
        description: Location latitude coordinate
      longitude:
        type: number
        description: Location longitude coordinate
      address:
        type: string
        description: Location address
      placeId:
        type: string
        description: Google Places ID
  login:
    type: object
    required:
        - emailOrUsername
        - password
    properties:
      emailOrUsername:
        type: string
        description: user Email or Username
      password:
        type: string
        description: user Password
  users:
    type: object
    required:
        - email
        - password
        - username
        - phoneNumber
    properties:
      email:
        type: string
        description: user Email
      password:
        type: string
        description: user Password
      username:
        type: string
        description: user Username
      phoneNumber:
        type: string
        description: user Phone Number
      gender:
        type: string
        enum:
          - male
          - female
          - other
        description: user Gender
      role:
        type: string
        enum:
          - admin
          - user
          - barber
        default: user
        description: user Role
      location:
        $ref: '#/definitions/location'
        description: user Location object
      profileImage:
        type: string
        description: URL to user's profile image on Cloudinary

schemes:
 - https
 - http
