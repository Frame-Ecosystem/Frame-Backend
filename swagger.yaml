# ============================================
# CLIENT ENDPOINTS
# ============================================

  /v1/client/lounges:
    get:
      tags:
        - client
      summary: Get all lounges with pagination (for clients and admins to browse)
      description: |
        Browse all available lounges with filtering, searching, and pagination.
        Only non-blocked lounges are returned.
        Sensitive fields (password, tokens) are automatically excluded.

        **Location-based sorting**: If the authenticated client has location data stored,
        lounges are automatically sorted by distance from the client's location (nearest first).
        Lounges without location data appear at the end. If no client location is available,
        traditional sorting is used.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
          description: Page number (minimum 1)
        - name: limit
          in: query
          type: integer
          default: 10
          description: Items per page (minimum 1, maximum 100)
        - name: search
          in: query
          type: string
          description: Search term (searches in loungeTitle, firstName, lastName, bio)
          example: "Hair Salon"
        - name: gender
          in: query
          type: string
          enum: [male, female, unisex, kids]
          description: Filter by gender category
        - name: sortBy
          in: query
          type: string
          enum: [createdAt, loungeTitle, firstName, lastName]
          default: createdAt
          description: Field to sort by (only used when client has no location data)
        - name: sortOrder
          in: query
          type: string
          enum: [asc, desc]
          default: desc
          description: Sort order (only used when client has no location data)
      responses:
        200:
          description: Lounges retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/LoungePublicProfile'
              pagination:
                type: object
                properties:
                  currentPage:
                    type: integer
                    example: 1
                  totalPages:
                    type: integer
                    example: 5
                  totalItems:
                    type: integer
                    example: 47
                  itemsPerPage:
                    type: integer
                    example: 10
                  hasNextPage:
                    type: boolean
                    example: true
                  hasPrevPage:
                    type: boolean
                    example: false
              message:
                type: string
                example: Lounges retrieved successfully
        400:
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated or not a client
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

  /v1/client/lounges/{loungeId}:
    get:
      tags:
        - client
      summary: Get lounge details by ID (for clients and admins to view lounge profile)
      description: |
        Retrieve detailed information about a specific lounge.
        Only non-blocked lounges can be accessed.
        Sensitive fields are automatically excluded.
      security:
        - bearerAuth: []
      parameters:
        - name: loungeId
          in: path
          required: true
          type: string
          description: Lounge ID
          example: "507f1f77bcf86cd799439011"
      responses:
        200:
          description: Lounge details retrieved successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/LoungePublicProfile'
              message:
                type: string
                example: Lounge details retrieved successfully
        400:
          description: Invalid lounge ID format or lounge not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated or not a client
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

  /v1/client/lounges/{loungeId}/services:
    get:
      tags:
        - client
      summary: Get all services offered by a specific lounge (for clients and admins)
      description: |
        Retrieve all active services offered by a specific lounge.
        Only services from non-blocked lounges with active status are returned.
        Service details are populated including service name, category, etc.
      security:
        - bearerAuth: []
      parameters:
        - name: loungeId
          in: path
          required: true
          type: string
          description: Lounge ID
          example: "507f1f77bcf86cd799439011"
      responses:
        200:
          description: Lounge services retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/LoungeServiceResponse'
              count:
                type: integer
                description: Number of services returned
                example: 5
              message:
                type: string
                example: Lounge services retrieved successfully
        400:
          description: Invalid lounge ID format or lounge not found/blocked
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated or not a client
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

  /v1/client/services/{serviceId}/lounges:
    get:
      tags:
        - client
      summary: Filter lounges by service (for clients to find lounges offering specific services)
      description: |
        Find lounges that offer a specific service. Results can be sorted by distance if user location is provided.
        Supports pagination, search, gender filtering, and location-based sorting.
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          type: string
          description: Service ID to filter lounges by
          example: "507f1f77bcf86cd799439011"
        - name: page
          in: query
          type: integer
          default: 1
          description: Page number
        - name: limit
          in: query
          type: integer
          default: 10
          maximum: 100
          description: Items per page (max 100)
        - name: search
          in: query
          type: string
          description: Search term (searches in loungeTitle, firstName, lastName, bio)
        - name: gender
          in: query
          type: string
          enum: [male, female, unisex, kids]
          description: Filter by gender
        - name: sortBy
          in: query
          type: string
          enum: [createdAt, loungeTitle, firstName, lastName, distance]
          default: createdAt
          description: Sort field (distance when location provided)
        - name: sortOrder
          in: query
          type: string
          enum: [asc, desc]
          default: desc
          description: Sort order
        - name: userLatitude
          in: query
          type: number
          format: float
          description: User's latitude for distance-based sorting
        - name: userLongitude
          in: query
          type: number
          format: float
          description: User's longitude for distance-based sorting
      responses:
        200:
          description: Lounges filtered by service retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/LoungePublicProfile'
              pagination:
                type: object
                properties:
                  currentPage:
                    type: integer
                    example: 1
                  totalPages:
                    type: integer
                    example: 5
                  totalItems:
                    type: integer
                    example: 42
                  itemsPerPage:
                    type: integer
                    example: 10
                  hasNextPage:
                    type: boolean
                    example: true
                  hasPrevPage:
                    type: boolean
                    example: false
              message:
                type: string
                example: Lounges filtered by service retrieved successfully
        400:
          description: Invalid service ID or pagination parameters
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Not authenticated or not a client/admin
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'

