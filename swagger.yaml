  /v1/bookings/availability:
    get:
      tags: [bookings]
      summary: Get agent availability
      operationId: getAgentAvailability
      description: |
        Returns unavailable time slots for specified agents plus lounge opening hours.
        Use this to find free slots for booking.
      security:
        - bearerAuth: []
      parameters:
        - name: agentIds
          in: query
          required: true
          type: string
          description: Comma-separated agent IDs
          example: "507f1f77bcf86cd799439011,507f1f77bcf86cd799439012"
      responses:
        200:
          description: Availability retrieved
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  unavailableSlots:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2026-02-21"
                        unavailableTimes:
                          type: array
                          items:
                            type: string
                          example: ["09:00", "09:30", "10:00"]
                  loungeOpeningHours:
                    $ref: '#/definitions/WeekOpeningHours'
              message:
                type: string
        400:
          description: Agent IDs required
        401:
          description: Unauthorized
        500:
          description: Server error

