            type: string
            description: Cloudinary public ID for the image
            example: "agents/agent_123"
      isBlocked:
        type: boolean
        description: Whether the agent account is blocked
        example: false
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  CreateAgentDto:
    type: object
    description: Data transfer object for creating a new agent
    required:
      - agentName
      - password
      - loungeId
      - idLoungeService
    properties:
      agentName:
        type: string
        description: Unique name identifier for the agent
        example: "john_doe"
        minLength: 1
      password:
        type: string
        description: Agent's password
        example: "secure_password_123"
        minLength: 6
      loungeId:
        type: string
        description: ID of the lounge this agent belongs to
        example: 507f1f77bcf86cd799439012
      idLoungeService:
        type: array
        items:
          type: string
        description: List of lounge service IDs that this agent can perform
        example: ["507f1f77bcf86cd799439013", "507f1f77bcf86cd799439014"]
        minItems: 1
      isBlocked:
        type: boolean
        description: Whether the agent should be blocked (optional, defaults to false)
        example: false

  UpdateAgentDto:
    type: object
    description: Data transfer object for updating an agent
    properties:
      agentName:
        type: string
        description: Unique name identifier for the agent
        example: "john_doe_updated"
        minLength: 1
      password:
        type: string
        description: New password for the agent
        example: "new_secure_password_123"
        minLength: 6
      isBlocked:
        type: boolean
        description: Whether the agent should be blocked
        example: true

  # ============================================
  # BOOKING DEFINITIONS
  # ============================================

  BookingStatus:
    type: string
    enum:
      - pending
      - confirmed
      - inQueue
      - cancelled
    description: Status of the booking
    example: "pending"

  Booking:
    type: object
    properties:
      _id:
        type: string
        description: Unique identifier for the booking
        example: "507f1f77bcf86cd799439011"
      clientId:
        $ref: '#/definitions/User'
        description: Reference to the client who made the booking
      loungeId:
        $ref: '#/definitions/User'
        description: Reference to the lounge where the booking is made
      loungeServiceIds:
        type: array
        items:
          $ref: '#/definitions/LoungeService'
        description: List of lounge service IDs being booked
      status:
        $ref: '#/definitions/BookingStatus'
      bookingDate:
        type: string
        format: date-time
        description: Date and time of the booking
        example: "2024-01-15T14:30:00.000Z"
      totalPrice:
        type: number
        description: Total price of the booking
        example: 150.00
      totalDuration:
        type: number
        description: Total duration in minutes for all services in the booking
        example: 120
        minimum: 0
      notes:
        type: string
        description: Additional notes for the booking
        example: "Please prepare the VIP room"
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time


  CreateBookingDto:
    type: object
    required:
      - clientId
      - loungeId
      - bookingDate
    properties:
      clientId:
        type: string
        description: ID of the client making the booking
        example: "507f1f77bcf86cd799439014"
      loungeId:
        type: string
        description: ID of the lounge where the booking is made
        example: "507f1f77bcf86cd799439015"
      loungeServiceIds:
        type: array
        items:
          type: string
        description: List of lounge service IDs being booked (optional)
        example: ["507f1f77bcf86cd799439016", "507f1f77bcf86cd799439017"]
      bookingDate:
        type: string
        format: date-time
        description: Date and time for the booking
        example: "2024-01-20T10:00:00.000Z"
      status:
        $ref: '#/definitions/BookingStatus'
        description: Initial status (defaults to pending)
      totalPrice:
        type: number
        description: Total price (auto-calculated if not provided)
        example: 150.00
        minimum: 0
      totalDuration:
        type: number
        description: Total duration in minutes (auto-calculated if not provided)
        example: 120
        minimum: 0
      notes:
        type: string
        description: Additional booking notes
        example: "Early appointment preferred"

  UpdateBookingDto:
    type: object
    description: Data transfer object for updating booking details. Clients can only update status to 'cancelled' and notes. Lounges and admins have full update access.
    properties:
      status:
        $ref: '#/definitions/BookingStatus'
        description: New status for the booking (clients can only set to 'cancelled')
      bookingDate:
        type: string
        format: date-time
        description: Updated booking date and time (lounges and admins only)
        example: "2024-01-21T11:00:00.000Z"
      totalPrice:
        type: number
        description: Updated total price (lounges and admins only)
        example: 175.00
        minimum: 0
      totalDuration:
        type: number
        description: Updated total duration in minutes (lounges and admins only)
        example: 150
        minimum: 0
      notes:
        type: string
        description: Updated booking notes (all authenticated users)
        example: "Customer requested additional services"

  BookingStats:
    type: object
    properties:
      _id:
        $ref: '#/definitions/BookingStatus'
        description: Status for which stats are provided
      count:
        type: integer
        description: Number of bookings with this status
        example: 15
      totalSpent:
        type: number
        description: Total amount spent (for client stats)
        example: 2250.00
      totalRevenue:
        type: number
        description: Total revenue generated (for lounge stats)
        example: 2250.00