  # ================================================================
  #  MARKETPLACE DTOs
  # ================================================================

  # ---- Cart ----
  AddToCartDto:
    type: object
    required:
      - productId
      - quantity
    properties:
      productId:
        type: string
        description: MongoDB ObjectId of the product
      variantIndex:
        type: integer
        minimum: 0
        description: Index of the product variant (0-based). Omit for default variant.
      quantity:
        type: integer
        minimum: 1

  UpdateCartItemDto:
    type: object
    required:
      - quantity
    properties:
      quantity:
        type: integer
        minimum: 0
        description: New quantity. Set to 0 to remove item.

  Cart:
    type: object
    properties:
      _id:
        type: string
      userId:
        type: string
      items:
        type: array
        items:
          type: object
          properties:
            productId:
              type: string
            variantIndex:
              type: integer
            quantity:
              type: integer
            price:
              type: number
            product:
              $ref: '#/definitions/Product'
      subtotal:
        type: number
      updatedAt:
        type: string
        format: date-time

  # ---- Order ----
  CreateOrderDto:
    type: object
    required:
      - storeId
      - items
      - paymentMethod
      - shippingAddress
    properties:
      storeId:
        type: string
        description: MongoDB ObjectId of the store
      items:
        type: array
        items:
          type: object
          required:
            - productId
            - quantity
          properties:
            productId:
              type: string
            variantIndex:
              type: integer
              minimum: 0
            quantity:
              type: integer
              minimum: 1
      paymentMethod:
        type: string
        description: Payment method enum value (e.g. cash_on_delivery, card)
      shippingAddress:
        type: object
        required:
          - fullName
          - phone
          - address
          - city
