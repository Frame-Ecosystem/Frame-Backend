          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ReviewReportDto'
      responses:
        200:
          description: Report reviewed
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Report'
              message:
                type: string
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin only
        404:
          description: Report not found
        500:
          description: Server error

# =====================================================================
#  DEFINITIONS
# =====================================================================
definitions:

  # ------------------------------------------------------------------
  #  Common
  # ------------------------------------------------------------------
  ErrorResponse:
    type: object
    properties:
      message:
        type: string
        description: Human-readable error message
        example: "Invalid credentials"
      code:
        type: string
        description: Machine-readable error code for client handling
        example: "INVALID_CREDENTIALS"

  Pagination:
    type: object
    properties:
      page:
        type: integer
        example: 1
      limit:
        type: integer
        example: 10
      total:
        type: integer
        example: 42
      pages:
        type: integer
        example: 5

  # ------------------------------------------------------------------
  #  Auth DTOs
  # ------------------------------------------------------------------
  LoginUserDto:
    type: object
    required:
      - emailOrPhone
      - password
    properties:
      emailOrPhone:
        type: string
        description: Email address or 8-digit phone number
        example: "user@example.com"
      password:
        type: string
        description: User password
        example: "SecureP@ss123"

  ForgotPasswordDto:
    type: object
    required:
      - email
    properties:
      email:
        type: string
        format: email
        example: "user@example.com"

  ResetPasswordDto:
    type: object
    required:
      - token
      - newPassword
    properties:
      token:
        type: string
        description: Reset token from email link
      newPassword:
        type: string
        minLength: 8
        maxLength: 128
        description: "New password  -  min 8 chars, uppercase, lowercase, number, special char (@$!%*?&)"
        example: "NewSecureP@ss456"

  VerifyEmailCodeDto:
    type: object
    required:
      - code
    properties:
      code:
        type: string
        description: Verification code received via email

  # ------------------------------------------------------------------
  #  User DTOs
  # ------------------------------------------------------------------
  CreateUserDto:
    type: object
    required:
      - password
    properties:
      email:
        type: string
        format: email
        description: User email (normalized to lowercase)
        example: "user@example.com"
      password:
        type: string
        minLength: 8
        maxLength: 128
        description: "8-128 chars with uppercase, lowercase, number, special char (@$!%*?&)"
        example: "SecureP@ss123"
      phoneNumber:
        type: string
        pattern: '^\d{8}$'
        description: Exactly 8 digits
        example: "12345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
        maxLength: 50
        example: "John"
      lastName:
        type: string
        maxLength: 50
        example: "Doe"
      loungeTitle:
        type: string
        maxLength: 100
        example: "Elite Hair Salon"
      type:
        type: string
        enum: [user, client, lounge]
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri

  AdminCreateUserDto:
    allOf:
      - $ref: '#/definitions/CreateUserDto'
      - type: object
        properties:
          type:
            type: string
            enum: [user, client, lounge, admin]
            description: User type (admin can set any type)
          isBlocked:
            type: boolean
            default: false

  UpdateUserDto:
    type: object
    description: All fields optional. Password cannot be changed here.
    properties:
      email:
        type: string
        format: email
      phoneNumber:
        type: string
        pattern: '^\d{8}$'
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
        maxLength: 50
      lastName:
        type: string
        maxLength: 50
      bio:
        type: string
        maxLength: 500
      theme:
        type: string
        maxLength: 50
      loungeTitle:
        type: string
        maxLength: 100
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: string
        format: uri
      coverImage:
        type: string
        format: uri

  ChangePasswordDto:
    type: object
    required:
      - currentPassword
      - newPassword
      - newPasswordConfirm
    properties:
      currentPassword:
        type: string
        example: "OldP@ssword123"
      newPassword:
        type: string
        minLength: 8
        maxLength: 128
        description: "Same strength requirements as signup"
        example: "NewSecureP@ss456"
      newPasswordConfirm:
        type: string
        description: Must match newPassword
        example: "NewSecureP@ss456"

  DeleteAccountDto:
    type: object
    required:
      - password
    properties:
      password:
        type: string
        description: Current password for confirmation
        example: "MyCurrentP@ss123"

  UpdateClientProfileDto:
    type: object
    properties:
      firstName:
        type: string
        maxLength: 50
      lastName:
        type: string
        maxLength: 50

  UpdateThemeDto:
    type: object
    required:
      - theme
    properties:
      theme:
        type: string
        maxLength: 50
        example: "dark"

  UpdateLanguageDto:
    type: object
    required:
      - language
    properties:
      language:
        type: string
        maxLength: 10
        example: "en"
        description: Language code (e.g. 'en', 'ar', 'fr')

  UpdateLoungeProfileDto:
    type: object
    properties:
      loungeTitle:
        type: string
        maxLength: 100
        example: "Elite Hair Salon"
      openingHours:
        $ref: '#/definitions/DayOpeningHoursDto'

  LocationDto:
    type: object
    required:
      - latitude
      - longitude
      - address
      - placeId
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
        example: 36.8065
      longitude:
        type: number
        minimum: -180
        maximum: 180
        example: 10.1815
      address:
        type: string
        maxLength: 500
        example: "123 Main Street, Tunis, Tunisia"
      placeId:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        example: "ChIJN1t_tDeuEmsRUsoyG83frY4"
      placeName:
        type: string
        maxLength: 200
        example: "Elite Hair Salon  -  Downtown"

  OpeningHoursDto:
    type: object
    properties:
      from:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        example: "09:00"
      to:
        type: string
        pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
        example: "18:00"

  DayOpeningHoursDto:
    type: object
    description: "Opening hours per day. Omit a day to leave unchanged; set `from`/`to` to null for closed days."
    properties:
      monday:
        $ref: '#/definitions/OpeningHoursDto'
      tuesday:
        $ref: '#/definitions/OpeningHoursDto'
      wednesday:
        $ref: '#/definitions/OpeningHoursDto'
      thursday:
        $ref: '#/definitions/OpeningHoursDto'
      friday:
        $ref: '#/definitions/OpeningHoursDto'
      saturday:
        $ref: '#/definitions/OpeningHoursDto'
      sunday:
        $ref: '#/definitions/OpeningHoursDto'

  WeekOpeningHours:
    type: object
    description: Full week opening hours (null values indicate closed)
    properties:
      monday:
        $ref: '#/definitions/OpeningHoursDto'
      tuesday:
        $ref: '#/definitions/OpeningHoursDto'
      wednesday:
        $ref: '#/definitions/OpeningHoursDto'
      thursday:
        $ref: '#/definitions/OpeningHoursDto'
      friday:
        $ref: '#/definitions/OpeningHoursDto'
      saturday:
        $ref: '#/definitions/OpeningHoursDto'
      sunday:
        $ref: '#/definitions/OpeningHoursDto'

  # ------------------------------------------------------------------
  #  User Responses
  # ------------------------------------------------------------------
  UserResponse:
    type: object
    description: User object (sensitive fields excluded  -  no password, no refreshTokens)
    properties:
      _id:
        type: string
        example: "507f1f77bcf86cd799439011"
      email:
        type: string
        example: "user@example.com"
      type:
        type: string
        enum: [user, client, lounge, admin]
      phoneNumber:
        type: string
        example: "12345678"
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
        example: "John"
      lastName:
        type: string
        example: "Doe"
      bio:
        type: string
      loungeTitle:
        type: string
      theme:
        type: string
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: object
        properties:
          url:
            type: string
          publicId:
            type: string
      coverImage:
        type: object
        properties:
          url:
            type: string
          publicId:
            type: string
      openingHours:
        $ref: '#/definitions/WeekOpeningHours'
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                ipAddress:
                  type: string
      isBlocked:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  LoungePublicProfile:
    type: object
    description: Lounge public profile for client browsing
    properties:
      _id:
        type: string
      email:
        type: string
      type:
        type: string
        example: "lounge"
      phoneNumber:
        type: string
      gender:
        type: string
        enum: [male, female, unisex, kids]
      firstName:
        type: string
      lastName:
        type: string
      bio:
        type: string
      loungeTitle:
        type: string
        example: "Elite Hair Salon"
      openingHours:
        $ref: '#/definitions/WeekOpeningHours'
      location:
        $ref: '#/definitions/LocationDto'
      profileImage:
        type: object
        properties:
          url:
            type: string
          publicId:
            type: string
      ratingSummary:
        type: object
        properties:
          averageRating:
            type: number
            example: 4.5
          ratingCount:
            type: integer
            example: 28
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
      createdAt:
        type: string
        format: date-time

  OnlineUserInfo:
    type: object
    properties:
      _id:
        type: string
      email:
        type: string
      sessionTrack:
        type: object
        properties:
          isOnline:
            type: boolean
          lastSeen:
            type: string
            format: date-time
          devices:
            type: array
            items:
              type: object

  # ------------------------------------------------------------------
  #  Agent
  # ------------------------------------------------------------------
  Agent:
    type: object
    properties:
      _id:
        type: string
        example: "507f1f77bcf86cd799439011"
      agentName:
        type: string
        example: "john_doe"
      loungeId:
        type: string
        example: "507f1f77bcf86cd799439012"
      idLoungeService:
        type: array
        items:
          type: string
        description: Lounge service IDs this agent can perform
      profileImage:
        type: object
        properties:
          url:
            type: string
          publicId:
            type: string
      isBlocked:
        type: boolean
        example: false
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  UpdateAgentDto:
    type: object
    properties:
      agentName:
        type: string
        minLength: 1
        example: "john_doe_updated"
      password:
        type: string
        minLength: 6
      isBlocked:
        type: boolean

  # ------------------------------------------------------------------
  #  Lounge Service
  # ------------------------------------------------------------------
  CreateLoungeServiceDto:
    type: object
    required:
      - loungeId
      - serviceId
      - price
      - duration
      - gender
    properties:
      loungeId:
        type: string
      serviceId:
        type: string
      agentIds:
        type: array
        items:
          type: string
      price:
        type: number
        minimum: 0
        example: 2500
      duration:
        type: number
        minimum: 1
        description: Duration in minutes
        example: 30
      gender:
        type: string
        enum: [men, women, unisex, kids]
      status:
        type: string
        enum: [ACTIVE, INACTIVE]
      description:
        type: string
        maxLength: 1000
      isActive:
        type: boolean

  UpdateLoungeServiceDto:
    type: object
    properties:
      serviceId:
        type: string
      agentIds:
        type: array
        items:
          type: string
      price:
        type: number
        minimum: 0
      duration:
        type: number
        minimum: 1
      gender:
        type: string
        enum: [men, women, unisex, kids]
      status:
        type: string
        enum: [ACTIVE, INACTIVE]
      description:
        type: string
        maxLength: 1000
      isActive:
        type: boolean

  LoungeServiceResponse:
    type: object
    properties:
      _id:
        type: string
      loungeId:
        type: string
      serviceId:
        type: string
      agentIds:
        type: array
        items:
          type: string
      price:
        type: number
        example: 2500
      duration:
        type: integer
        description: Duration in minutes
        example: 30
      gender:
        type: string
        enum: [men, women, unisex, kids]
      status:
        type: string
        enum: [ACTIVE, INACTIVE]
      description:
        type: string
      image:
        type: object
        properties:
          url:
            type: string
          publicId:
            type: string
      isActive:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  # ------------------------------------------------------------------
  #  Service & Category
  # ------------------------------------------------------------------
  ServiceResponse:
    type: object
    properties:
      _id:
        type: string
      name:
        type: string
        example: "Premium Haircut"
      categoryId:
        type: string
      description:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  ServiceCategoryResponse:
    type: object
    properties:
      _id:
        type: string
      name:
        type: string
        example: "Haircuts"
      description:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  # ------------------------------------------------------------------
  #  Service Suggestions
  # ------------------------------------------------------------------
  CreateServiceSuggestionDto:
    type: object
    required:
      - name
      - description
      - category
    properties:
      name:
        type: string
        minLength: 2
        maxLength: 100
        example: "Brazilian Blowout"
      description:
        type: string
        minLength: 10
        maxLength: 1000
        example: "A smoothing treatment for frizz-free hair lasting 12 weeks"
      category:
        type: string
        minLength: 2
        maxLength: 50
        example: "Hair Treatments"
      estimatedPrice:
        type: number
        minimum: 0
        example: 15000
      estimatedDuration:
        type: integer
        minimum: 15
        maximum: 480
        description: Duration in minutes
        example: 120
      targetGender:
        type: string
        enum: [men, women, unisex, kids]

  UpdateServiceSuggestionStatusDto:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        enum: [pending, rejected, implemented]
      adminNote:
        type: string
        maxLength: 500
      categoryId:
        type: string
        description: Required when status is `implemented`
      name:
        type: string
        maxLength: 100
      price:
        type: number
        minimum: 0
      duration:
        type: integer
        minimum: 15
        maximum: 480
      gender:
        type: string
        enum: [men, women, unisex, kids]

  AdminApproveServiceSuggestionDto:
    type: object
    required:
      - categoryId
    properties:
      categoryId:
        type: string
      name:
        type: string
        maxLength: 100
      price:
        type: number
        minimum: 0
      duration:
        type: integer
        minimum: 15
        maximum: 480
      gender:
        type: string
        enum: [men, women, unisex, kids]
      adminNote:
        type: string
        maxLength: 500

  ServiceSuggestionResponse:
    type: object
    properties:
      _id:
        type: string
      loungeId:
        type: string
      loungeName:
        type: string
      name:
        type: string
      description:
        type: string
      category:
        type: string
      estimatedPrice:
        type: number
      estimatedDuration:
        type: integer
      targetGender:
        type: string
        enum: [men, women, unisex, kids]
      status:
        type: string
        enum: [pending, rejected, implemented]
      adminNote:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  # ------------------------------------------------------------------
  #  Booking
  # ------------------------------------------------------------------
  BookingStatus:
    type: string
    enum: [pending, confirmed, inQueue, cancelled]

  CreateBookingDto:
    type: object
    required:
      - clientId
      - loungeId
      - bookingDate
    properties:
      clientId:
        type: string
        description: Client user ID
      loungeId:
        type: string
        description: Lounge user ID
      agentIds:
        type: array
        items:
          type: string
        description: Optional agent IDs to assign
      loungeServiceIds:
        type: array
        items:
          type: string
        description: Lounge service IDs being booked
      bookingDate:
        type: string
        format: date-time
        example: "2026-01-20T10:00:00.000Z"
      status:
        type: string
        enum: [pending, confirmed, inQueue, cancelled]
      totalPrice:
        type: number
        minimum: 0
        description: Auto-calculated if not provided
      totalDuration:
        type: number
        minimum: 0
        description: Duration in minutes (auto-calculated if not provided)
      notes:
        type: string
        maxLength: 500

  CreateQueueBookingDto:
    type: object
    required:
      - clientId
      - loungeId
      - agentId
    properties:
      clientId:
        type: string
      loungeId:
        type: string
      agentId:
        type: string
        description: Specific agent for this walk-in
      loungeServiceIds:
        type: array
        items:
          type: string
      notes:
        type: string
        maxLength: 500

  CreateLoungeQueueBookingDto:
    type: object
    required:
      - loungeId
      - agentId
    properties:
      loungeId:
        type: string
      agentId:
        type: string
      visitorName:
        type: string
        maxLength: 100
        description: Walk-in visitor name (no account required)
      clientPhone:
        type: string
        description: Optional visitor phone
      clientEmail:
        type: string
        format: email
        description: Optional visitor email
      loungeServiceIds:
        type: array
        items:
          type: string
      notes:
        type: string
        maxLength: 500

  UpdateBookingDto:
    type: object
    properties:
      status:
        type: string
        enum: [pending, confirmed, inQueue, cancelled]
        description: Clients can only set to `cancelled`
      bookingDate:
        type: string
        format: date-time
        description: Lounges/admins only
      totalPrice:
        type: number
        minimum: 0
      totalDuration:
        type: number
        minimum: 0
      notes:
        type: string
        maxLength: 500
      cancelledBy:
        type: object
        properties:
          idUser:
            type: string
          cancelledByName:
            type: string
          note:
            type: string
            maxLength: 500
      cancellationNote:
        type: string
        maxLength: 500

  Booking:
    type: object
    properties:
      _id:
        type: string
      clientId:
        type: string
        description: Populated user object or ID
      loungeId:
        type: string
        description: Populated user object or ID
      agentIds:
        type: array
        items:
          type: string
      loungeServiceIds:
        type: array
        items:
          type: string
        description: Populated lounge service objects or IDs
      status:
        type: string
        enum: [pending, confirmed, inQueue, cancelled]
      bookingDate:
        type: string
        format: date-time
      totalPrice:
        type: number
      totalDuration:
        type: number
        description: Total duration in minutes
      notes:
        type: string
      cancelledBy:
        type: object
        properties:
          idUser:
            type: string
          cancelledByName:
            type: string
          note:
            type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  BookingStats:
    type: object
    properties:
      _id:
        type: string
        description: Booking status
      count:
        type: integer
        example: 15
      totalSpent:
        type: number
        description: Total amount (client stats)
      totalRevenue:
        type: number
        description: Total revenue (lounge stats)

  # ------------------------------------------------------------------
  #  Queue
  # ------------------------------------------------------------------
  QueuePersonStatus:
    type: string
    enum: [waiting, inService, completed, absent]
    description: "waiting â†’ inService â†’ completed | waiting â†’ absent â†’ waiting"

  QueuePerson:
    type: object
    properties:
      bookingId:
        type: string
      clientId:
        type: string
      position:
        type: integer
        minimum: 1
        example: 1
      status:
        type: string
        enum: [waiting, inService, completed, absent]
      joinedAt:
        type: string
        format: date-time

  Queue:
    type: object
    properties:
      _id:
        type: string
      agentId:
        type: string
      date:
        type: string
        format: date
        example: "2026-02-24"
      persons:
        type: array
        items:
          $ref: '#/definitions/QueuePerson'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  AddToQueueDto:
    type: object
    required:
      - bookingId
    properties:
      bookingId:
        type: string
        description: Booking must have `inQueue` status
      position:
        type: integer
        minimum: 1
        description: Queue position (appends to end if omitted)

  UpdateQueuePersonDto:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        enum: [waiting, inService, completed, absent]
        description: "Valid transitions: waitingâ†’inService, waitingâ†’absent, inServiceâ†’completed, absentâ†’waiting"

  ReorderQueuePersonDto:
    type: object
    required:
      - newPosition
    properties:
      newPosition:
        type: integer
        minimum: 1
        description: New position in queue (other positions auto-adjust)

  # ------------------------------------------------------------------
  #  Notification
  # ------------------------------------------------------------------
  Notification:
    type: object
    properties:
      _id:
        type: string
      userId:
        type: string
        description: Recipient user ID
      title:
        type: string
        example: "Booking Confirmed"
      body:
        type: string
        example: "Your booking for Jan 20 has been confirmed"
      type:
        type: string
        enum:
          - booking:created
          - booking:confirmed
          - booking:cancelled
          - booking:inQueue
          - booking:completed
          - booking:absent
          - queue:inService
          - queue:autoCancelled
          - queue:backInQueue
          - queue:reminder
          - queue:positionChanged
      isRead:
        type: boolean
        example: false
      metadata:
        type: object
        properties:
          bookingId:
            type: string
          loungeId:
            type: string
          clientId:
            type: string
          agentId:
            type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  MarkNotificationsReadDto:
    type: object
    properties:
      notificationIds:
        type: array
        items:
          type: string
        description: Specific notification IDs to mark read. Omit to mark all as read.

  RegisterDeviceTokenDto:
    type: object
    required:
      - token
      - deviceId
      - platform
    properties:
      token:
        type: string
        description: FCM/APNs push notification token
      deviceId:
        type: string
        description: Unique device identifier
      platform:
        type: string
        enum: [ios, android, web]

  UnregisterDeviceTokenDto:
    type: object
    required:
      - deviceId
    properties:
      deviceId:
        type: string
        description: Device identifier to unregister

  # ------------------------------------------------------------------
  #  Rating
  # ------------------------------------------------------------------
  Rating:
    type: object
    properties:
      _id:
        type: string
      clientId:
        type: string
      loungeId:
        type: string
      score:
        type: integer
        minimum: 1
        maximum: 5
        example: 4
      comment:
        type: string
        example: "Great service, very professional!"
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  UpsertRatingDto:
    type: object
    required:
      - loungeId
      - score
    properties:
      loungeId:
        type: string
      score:
        type: integer
        minimum: 1
        maximum: 5
        example: 5
      comment:
        type: string
        maxLength: 1000

  # ------------------------------------------------------------------
  #  Like (Lounge)
  # ------------------------------------------------------------------
  Like:
    type: object
    properties:
      _id:
        type: string
      clientId:
        type: string
      loungeId:
        type: string
      createdAt:
        type: string
        format: date-time

  # ------------------------------------------------------------------
  #  Follow
  # ------------------------------------------------------------------
  Follow:
    type: object
    properties:
      _id:
        type: string
      followerId:
        type: string
      followingId:
        type: string
      followerType:
        type: string
        enum: [client, lounge]
      followingType:
        type: string
        enum: [client, lounge]
      createdAt:
        type: string
        format: date-time

  # ------------------------------------------------------------------
  #  Post
  # ------------------------------------------------------------------
  PostMedia:
    type: object
    properties:
      url:
        type: string
        example: "https://pub-xxxxx.r2.dev/posts/abc123/image-1.jpg"
      publicId:
        type: string

  Post:
    type: object
    properties:
      _id:
        type: string
      authorId:
        type: string
      authorType:
        type: string
        enum: [client, lounge]
      text:
        type: string
        example: "Just got a fresh cut! #barber #style"
      media:
        type: array
        items:
          $ref: '#/definitions/PostMedia'
      hashtags:
        type: array
        items:
          type: string
        example: ["barber", "style"]
      likeCount:
        type: integer
        example: 42
      commentCount:
        type: integer
        example: 5
      saveCount:
        type: integer
        example: 3
      isHidden:
        type: boolean
        example: false
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  UpdatePostDto:
    type: object
    properties:
      text:
        type: string
        maxLength: 2200
      hashtags:
        type: array
        items:
          type: string
        maxItems: 10

  # ------------------------------------------------------------------
  #  Reel
  # ------------------------------------------------------------------
  Reel:
    type: object
    properties:
      _id:
        type: string
      authorId:
        type: string
      authorType:
        type: string
        enum: [client, lounge]
      caption:
        type: string
      videoUrl:
        type: string
      videoPublicId:
        type: string
      thumbnailUrl:
        type: string
      thumbnailPublicId:
        type: string
      duration:
        type: number
        minimum: 1
        maximum: 60
        description: Duration in seconds
      hashtags:
        type: array
        items:
          type: string
      likeCount:
        type: integer
      commentCount:
        type: integer
      saveCount:
        type: integer
      isHidden:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  UpdateReelDto:
    type: object
    properties:
      caption:
        type: string
        maxLength: 2200
      hashtags:
        type: array
        items:
          type: string
        maxItems: 10

  # ------------------------------------------------------------------
  #  Comment
  # ------------------------------------------------------------------
  Comment:
    type: object
    properties:
      _id:
        type: string
      authorId:
        type: string
      targetId:
        type: string
        description: Post or Reel ID
      targetType:
        type: string
        enum: [post, reel]
      text:
        type: string
        example: "Amazing work! ðŸ”¥"
      parentCommentId:
        type: string
        description: "null for top-level comments; set for replies"
      likeCount:
        type: integer
      isHidden:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  CreateCommentDto:
    type: object
    required:
      - text
    properties:
      text:
        type: string
        maxLength: 1000
        example: "Great work!"
      parentCommentId:
        type: string
        description: Reply to this comment (omit for top-level comment)

  # ------------------------------------------------------------------
  #  Report
  # ------------------------------------------------------------------
  Report:
    type: object
    properties:
      _id:
        type: string
      reporterId:
        type: string
      targetId:
        type: string
      targetType:
        type: string
        enum: [post, reel, comment]
      reason:
        type: string
        example: "Inappropriate content"
      status:
        type: string
        enum: [pending, reviewed, dismissed]
      adminNote:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  CreateReportDto:
    type: object
    required:
      - reason
    properties:
      reason:
        type: string
        maxLength: 500
        example: "This content contains inappropriate language"

  ReviewReportDto:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        enum: [pending, reviewed, dismissed]
      adminNote:
        type: string
        maxLength: 500

  # ------------------------------------------------------------------
  #  Hashtag
  # ------------------------------------------------------------------
  Hashtag:
    type: object
    properties:
      _id:
        type: string
      name:
        type: string
        example: "hairstyle"
      postCount:
        type: integer
        example: 142
      createdAt:
        type: string
        format: date-time
