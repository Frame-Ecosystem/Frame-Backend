      tags: [agents]
      summary: Create agent
      operationId: createAgent
      description: |
        Create a new agent. Supports both file upload and JSON body.
        Admins must specify `loungeId`; lounges create agents for themselves.
      security:
        - bearerAuth: []
        - csrfToken: []
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: agentName
          in: formData
          required: true
          type: string
          description: Unique agent name identifier
        - name: password
          in: formData
          required: true
          type: string
          description: Agent password
        - name: loungeId
          in: formData
          required: false
          type: string
          description: Lounge ID (required for admins)
        - name: isBlocked
          in: formData
          required: false
          type: boolean
          description: Block state (default false)
        - name: image
          in: formData
          required: false
          type: file
          description: Profile image file
      responses:
        201:
          description: Agent created
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Agent'
              message:
                type: string
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden  -  admin or lounge only
        409:
          description: Agent name already exists
        500:
          description: Server error

