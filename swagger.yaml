      parameters:
        - name: page
          in: query
          type: integer
          default: 1
          description: Page number
        - name: limit
          in: query
          type: integer
          default: 20
          description: Items per page
      responses:
        200:
          description: Lounge services retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/LoungeServiceResponse'
              page:
                type: integer
              limit:
                type: integer
              total:
                type: integer
              totalPages:
                type: integer
              message:
                type: string
        401:
          description: Unauthorized
        500:
          description: Server error
    post:
      tags:
        - lounge services
      summary: Create a new lounge service
      security:
        - bearerAuth: []
        - csrfToken: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - loungeId
              - serviceId
              - price
              - duration
            properties:
              loungeId:
                type: string
                description: Lounge ID (User with type lounge)
                example: "507f1f77bcf86cd799439011"
              serviceId:
                type: string
                description: Service ID reference
                example: "507f1f77bcf86cd799439012"
              price:
                type: number
                description: Price in smallest currency unit (e.g., cents for USD)
                example: 2500
              duration:
                type: integer
                description: Duration in minutes
                minimum: 1
                example: 30
              gender:
                type: string
                enum: [men, women, unisex, kids]
                description: Gender category for the service
                example: men
              status:
                type: string
                enum: [ACTIVE, INACTIVE]
                default: ACTIVE
                description: Service status
                example: ACTIVE
              description:
                type: string
                description: Service description
                example: "Premium haircut service"
              image:
                type: string
                format: uri
                description: Image URL for the service (optional)
                example: "https://res.cloudinary.com/xxx/image/upload/v123/service_abc.jpg"
              isActive:
                type: boolean
                default: true
                description: Service active status
      responses:
        201:
          description: Lounge service created successfully
          schema:
            $ref: '#/definitions/LoungeServiceResponse'
        400:
          description: Invalid request data
        401:
          description: Unauthorized
        409:
          description: Service already exists for this lounge
        500:
          description: Server error

