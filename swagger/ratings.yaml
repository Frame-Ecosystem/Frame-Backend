# Rating endpoints — generalized for client/lounge/agent
/v1/ratings:
  put:
    tags: [Ratings]
    summary: Create or update rating (client, lounge, or agent)
    description: |
      Rate a target user. Any user can rate any lounge or agent.
      Self-ratings are rejected. Clients cannot be rated.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId, score]
            properties:
              targetId: { type: string, description: ID of the user being rated }
              score: { type: integer, minimum: 1, maximum: 5 }
              comment: { type: string, maxLength: 1000 }
    responses:
      '200': { description: Rating saved }
      '400': { description: Invalid rating pair or self-rating }

/v1/ratings/target/{targetId}:
  get:
    tags: [Ratings]
    summary: Get paginated ratings for a target user (lounge or agent)
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string }
      - name: page
        in: query
        schema: { type: integer, minimum: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50 }
    responses:
      '200': { description: Rating list with pagination }

/v1/ratings/me/{targetId}:
  get:
    tags: [Ratings]
    summary: Get my rating for a target (client, lounge, or agent)
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: My rating or null }

/v1/ratings/{targetId}:
  delete:
    tags: [Ratings]
    summary: Delete my rating for a target (client, lounge, or agent)
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: Rating deleted }
