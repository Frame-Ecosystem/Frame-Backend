# Service Categories endpoints
/v1/admin/service-categories:
  get:
    tags: [Service Categories]
    summary: List all categories
    responses:
      '200': { description: Category list }
  post:
    tags: [Service Categories]
    summary: Create category (admin)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 2, maxLength: 100 }
              description: { type: string, maxLength: 500 }
    responses:
      '201': { description: Created }

/v1/admin/service-categories/search:
  get:
    tags: [Service Categories]
    summary: Search categories
    parameters:
      - name: q
        in: query
        schema: { type: string }
    responses:
      '200': { description: Search results }

/v1/admin/service-categories/{categoryId}:
  get:
    tags: [Service Categories]
    summary: Get category by ID
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: Category details }
  put:
    tags: [Service Categories]
    summary: Update category (admin)
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, minLength: 2, maxLength: 100 }
              description: { type: string, maxLength: 500 }
    responses:
      '200': { description: Updated }
  delete:
    tags: [Service Categories]
    summary: Delete category (admin)
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: Deleted }
