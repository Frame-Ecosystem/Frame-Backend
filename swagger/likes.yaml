# ── Likes ──

/v1/likes/{loungeId}:
  post:
    tags: [Likes]
    summary: Toggle like / unlike a lounge
    description: If the client has not liked the lounge, a like is created. If the client has already liked the lounge, the like is removed (unlike).
    security:
      - bearerAuth: []
    parameters:
      - name: loungeId
        in: path
        required: true
        schema: { type: string }
        description: ID of the lounge to like/unlike
    responses:
      '200':
        description: Like toggled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    liked: { type: boolean, example: true }
                message: { type: string, example: Lounge liked }
      '400':
        description: Invalid lounge ID or lounge not found
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        $ref: '#/components/responses/401'
      '403':
        $ref: '#/components/responses/403'

/v1/likes/me:
  get:
    tags: [Likes]
    summary: Get all lounges liked by the current client
    description: Returns a paginated list of lounges the authenticated client has liked, newest first.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    responses:
      '200':
        description: List of liked lounges
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id: { type: string }
                      clientId: { type: string }
                      loungeId:
                        type: object
                        description: Populated lounge summary
                        properties:
                          _id: { type: string }
                          firstName: { type: string }
                          lastName: { type: string }
                          loungeTitle: { type: string }
                          profileImage:
                            type: object
                            properties:
                              url: { type: string }
                              publicId: { type: string }
                          averageRating: { type: number }
                          ratingCount: { type: integer }
                          likeCount: { type: integer }
                      createdAt: { type: string, format: date-time }
                total: { type: integer }
                page: { type: integer }
                limit: { type: integer }
      '401':
        $ref: '#/components/responses/401'
      '403':
        $ref: '#/components/responses/403'

/v1/likes/check/{loungeId}:
  get:
    tags: [Likes]
    summary: Check if client liked a lounge
    description: Returns whether the authenticated client has liked the specified lounge.
    security:
      - bearerAuth: []
    parameters:
      - name: loungeId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Like status
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    liked: { type: boolean }
      '401':
        $ref: '#/components/responses/401'
      '403':
        $ref: '#/components/responses/403'

/v1/likes/lounge/{loungeId}:
  get:
    tags: [Likes]
    summary: Get clients who liked a lounge
    description: Returns a paginated list of clients who liked a specific lounge, newest first.
    security:
      - bearerAuth: []
    parameters:
      - name: loungeId
        in: path
        required: true
        schema: { type: string }
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    responses:
      '200':
        description: List of clients who liked the lounge
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id: { type: string }
                      clientId:
                        type: object
                        description: Populated client summary
                        properties:
                          _id: { type: string }
                          firstName: { type: string }
                          lastName: { type: string }
                          profileImage:
                            type: object
                            properties:
                              url: { type: string }
                              publicId: { type: string }
                      loungeId: { type: string }
                      createdAt: { type: string, format: date-time }
                total: { type: integer }
                page: { type: integer }
                limit: { type: integer }
      '401':
        $ref: '#/components/responses/401'
      '404':
        $ref: '#/components/responses/404'
