# Like endpoints — generalized for client/lounge/agent

/v1/likes/{targetId}:
  post:
    tags: [Likes]
    summary: Toggle like / unlike a target user
    description: |
      Toggle like on a target user (lounge or agent). Allowed like pairs:
      - Client → Lounge
      - Client → Agent
      - Lounge → Agent

      Self-likes are rejected.
    security:
      - bearerAuth: []
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string }
        description: ID of the user to like/unlike (lounge or agent)
    responses:
      '200':
        description: Like toggled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    liked: { type: boolean, example: true }
                message: { type: string, example: Liked }
      '400':
        description: Invalid target, self-like, or invalid like pair
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        $ref: '#/components/responses/401'
      '403':
        $ref: '#/components/responses/403'

/v1/likes/me:
  get:
    tags: [Likes]
    summary: Get all targets liked by the current user
    description: Returns a paginated list of users the authenticated user has liked, newest first.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    responses:
      '200':
        description: List of liked users
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id: { type: string }
                      likerId: { type: string }
                      targetId:
                        type: object
                        description: Populated target user summary
                        properties:
                          _id: { type: string }
                          firstName: { type: string }
                          lastName: { type: string }
                          loungeTitle: { type: string }
                          profileImage:
                            type: object
                            properties:
                              url: { type: string }
                              publicId: { type: string }
                          averageRating: { type: number }
                          ratingCount: { type: integer }
                          likeCount: { type: integer }
                          type: { type: string, enum: [client, lounge, agent] }
                      createdAt: { type: string, format: date-time }
                total: { type: integer }
                page: { type: integer }
                limit: { type: integer }
      '401':
        $ref: '#/components/responses/401'
      '403':
        $ref: '#/components/responses/403'

/v1/likes/check/{targetId}:
  get:
    tags: [Likes]
    summary: Check if user liked a target
    description: Returns whether the authenticated user has liked the specified target.
    security:
      - bearerAuth: []
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Like status
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    liked: { type: boolean }
      '401':
        $ref: '#/components/responses/401'
      '403':
        $ref: '#/components/responses/403'

/v1/likes/target/{targetId}:
  get:
    tags: [Likes]
    summary: Get users who liked a target
    description: Returns a paginated list of users who liked a specific target, newest first.
    security:
      - bearerAuth: []
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string }
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    responses:
      '200':
        description: List of users who liked the target
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id: { type: string }
                      likerId:
                        type: object
                        description: Populated liker summary
                        properties:
                          _id: { type: string }
                          firstName: { type: string }
                          lastName: { type: string }
                          profileImage:
                            type: object
                            properties:
                              url: { type: string }
                              publicId: { type: string }
                          type: { type: string, enum: [client, lounge, agent] }
                      targetId: { type: string }
                      createdAt: { type: string, format: date-time }
                total: { type: integer }
                page: { type: integer }
                limit: { type: integer }
      '401':
        $ref: '#/components/responses/401'
      '404':
        $ref: '#/components/responses/404'
