# Service Suggestions endpoints
/v1/service-suggestions:
  get:
    tags: [Service Suggestions]
    summary: List suggestions (paginated)
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1 }
      - name: status
        in: query
        schema: { type: string, enum: [pending, rejected, implemented] }
    responses:
      '200': { description: Suggestion list }
  post:
    tags: [Service Suggestions]
    summary: Create suggestion (lounge only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, description]
            properties:
              name: { type: string, minLength: 2, maxLength: 200 }
              description: { type: string, minLength: 10, maxLength: 1000 }
              estimatedPrice: { type: number, minimum: 0 }
              estimatedDuration: { type: number, minimum: 15, maximum: 480 }
              targetGender: { type: string, enum: [men, women, unisex, kids] }
    responses:
      '201': { description: Created }

/v1/service-suggestions/stats:
  get:
    tags: [Service Suggestions]
    summary: Suggestion statistics (admin)
    responses:
      '200': { description: Stats }

/v1/service-suggestions/{suggestionId}:
  get:
    tags: [Service Suggestions]
    summary: Get suggestion by ID
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: Suggestion details }
  put:
    tags: [Service Suggestions]
    summary: Update suggestion (lounge owner)
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 200 }
              description: { type: string, maxLength: 1000 }
              estimatedPrice: { type: number, minimum: 0 }
              estimatedDuration: { type: number, minimum: 15, maximum: 480 }
              targetGender: { type: string, enum: [men, women, unisex, kids] }
    responses:
      '200': { description: Updated }
  delete:
    tags: [Service Suggestions]
    summary: Delete suggestion
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: Deleted }

/v1/service-suggestions/{suggestionId}/status:
  patch:
    tags: [Service Suggestions]
    summary: Update suggestion status (admin)
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [pending, rejected, implemented] }
              adminNote: { type: string, maxLength: 500 }
              categoryId: { type: string }
              name: { type: string, maxLength: 100 }
              price: { type: number, minimum: 0 }
              duration: { type: number, minimum: 15, maximum: 480 }
              gender: { type: string, enum: [men, women, unisex, kids] }
    responses:
      '200': { description: Status updated }

/v1/service-suggestions/{suggestionId}/admin-approve:
  patch:
    tags: [Service Suggestions]
    summary: Admin approve & create service from suggestion
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [categoryId]
            properties:
              status: { type: string, enum: [pending, rejected, implemented] }
              categoryId: { type: string }
              name: { type: string, maxLength: 100 }
              price: { type: number, minimum: 0 }
              duration: { type: number, minimum: 15, maximum: 480 }
              gender: { type: string, enum: [men, women, unisex, kids] }
              adminNote: { type: string, maxLength: 500 }
    responses:
      '200': { description: Approved and implemented }
