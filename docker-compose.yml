version: '3.8'

services:
  proxy:
    image: nginx:alpine
    container_name: frame-beauty-proxy
    ports:
      - '80:80'
      - '443:443'  # Add HTTPS port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates
    restart: 'unless-stopped'
    networks:
      - backend
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  server:
    build:
      context: ./
      target: production
      dockerfile: Dockerfile
    container_name: frame-beauty-server
    env_file:
      - .env.production
    ports:
      - '3000:3000'
    restart: 'unless-stopped'
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_HOST=mongo
      - DB_PORT=27017
      - DB_DATABASE=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:6-jammy
    container_name: frame-beauty-mongo
    restart: 'unless-stopped'
    environment:
      MONGO_INITDB_DATABASE: prod
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
